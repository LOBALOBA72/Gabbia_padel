["21:00","libero",1],["21:30","libero",1],["22:00","pieno",0],["22:30","libero",1],["23:00","tardi",1]];

me:["Profilo","il tuo curriculum"],add:["Nuovo matto","iscrivi un giocatore"],result:["Risultato","chi ha vinto?"],tour:["Torneo","tabellone a eliminazione"]};

var S=null;
try{S=JSON.parse(localStorage.getItem("gabbia.v2"))}catch(e){}
if(!S||!S.roster)S={screen:"home",day:3,slot:"21:00",court:1,pairSeed:0,
  lineup:["Zanza","Il Muro","Bandana","Smash"],selectedSlot:null,

  nick:"",name:"",elo:"1500",gender:"M",winner:null,set1:"",set2:"",set3:"",stake:"",

  matches:[],activeMatchId:null,me:null,tournament:null,tourSize:8,tourType:"elim",tourGender:"all",tourPairMode:"balanced",tourSelected:{},tourTeams:[],tourPick:null,tourCourts:2,tourDuration:null};
if(!S.penalties)S.penalties=[{title:"4 birre al vincitore",who:"tu → Zanza",done:false},
  {title:"Porti le palline per 3 turni",who:"tu → gruppo",done:false},

function save(){try{localStorage.setItem("gabbia.v2",JSON.stringify(S))}catch(e){}}
function set(k,v){S[k]=v;save();render()}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}

var SB_URL="https://ttshxiiwmnuqdjupcmal.supabase.co";
var SB_KEY="sb_publishable_U8kxKxd4MVg6Cih2_CqVhg_H1IrofWp";
var sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;

function parseRecord(rec){var m=(rec||"0V · 0S").match(/\d+/g)||[0,0];return{wins:+m[0],losses:+m[1]}}
function applyPlayers(rows){
  S.roster=rows.map(function(r){return{id:r.id,nick:r.nick,name:r.name,elo:r.elo,gender:r.gender,
    record:(r.wins||0)+"V · "+(r.losses||0)+"S",delta:r.last_delta||""}}).sort(function(a,b){return b.elo-a.elo});
  save();
}
function applyMatches(rows){
  S.matches=rows.map(function(r){return{id:r.id,day:r.day,slot:r.slot,court:r.court,stake:r.stake||"",
    teams:[{players:r.team_a},{players:r.team_b}]}});
  save();
}
function applyPenalties(rows){
  S.penalties=rows.map(function(r){return{id:r.id,title:r.title,who:r.who,done:r.done}});
  save();
}
async function refetch(table){
  if(!sb)return;
  var col=table==="players"?"elo":"created_at",asc=table!=="players";
  var res=await sb.from(table).select("*").order(col,{ascending:asc});
  if(res.error)return;
  if(table==="players")applyPlayers(res.data);
  if(table==="matches")applyMatches(res.data);
  if(table==="penalties")applyPenalties(res.data);
  render();
}
async function initSync(){
  if(!sb)return;
  try{
    var pl=await sb.from("players").select("*");
    if(!pl.error&&pl.data&&pl.data.length===0){
      var seed=ROSTER.map(function(p){var rc=parseRecord(p.record);
        return{nick:p.nick,name:p.name,elo:p.elo,gender:p.gender,wins:rc.wins,losses:rc.losses,last_delta:p.delta}});
      await sb.from("players").insert(seed);
      pl=await sb.from("players").select("*");
    }
    if(!pl.error)applyPlayers(pl.data);
    var mt=await sb.from("matches").select("*").order("created_at");
    if(!mt.error)applyMatches(mt.data);
    var pn=await sb.from("penalties").select("*").order("created_at");
    if(!pn.error)applyPenalties(pn.data);
    render();
    sb.channel("gabbia-sync")
      .on("postgres_changes",{event:"*",schema:"public",table:"players"},function(){refetch("players")})
      .on("postgres_changes",{event:"*",schema:"public",table:"matches"},function(){refetch("matches")})
      .on("postgres_changes",{event:"*",schema:"public",table:"penalties"},function(){refetch("penalties")})
      .subscribe();
  }catch(e){}
}

function balanced(){
  var all=S.roster.concat(BENCH),byNick={};
  all.forEach(function(p){byNick[p.nick]=p});
  var pool=S.lineup.map(function(n){return byNick[n]||all[0]});
  var combos=[[0,1,2,3],[0,2,1,3],[0,3,1,2]];
  var sc=combos.map(function(c){var a=pool[c[0]].elo+pool[c[1]].elo,b=pool[c[2]].elo+pool[c[3]].elo;
    return{c:c,diff:Math.abs(a-b),a:a,b:b}}).sort(function(x,y){return x.diff-y.diff});
  var p=sc[S.pairSeed%sc.length];
  return{diff:p.diff,teams:[{players:[pool[p.c[0]],pool[p.c[1]]],sum:p.a},
    {players:[pool[p.c[2]],pool[p.c[3]]],sum:p.b}]};
}

var A={
  nav:function(k){set("screen",k)},
  pickDay:function(d){set("day",d)},
  pickSlot:function(t){set("slot",t)},
  pickCourt:function(i){set("court",i)},
  confirm:function(){set("screen","pairs")},
  shuffle:function(){set("pairSeed",S.pairSeed+1)},
  pickSlotIdx:function(i){S.selectedSlot=S.selectedSlot===i?null:i;save();render()},
  swapBench:function(nick){
    if(S.selectedSlot===null)return;
    var busy=OTHER_MATCHES.some(function(m){return m.day===S.day&&m.slot===S.slot&&m.players.indexOf(nick)!==-1});
    if(busy)return;
    var lineup=S.lineup.slice();lineup[S.selectedSlot]=nick;
    S.lineup=lineup;S.selectedSlot=null;save();render();
  },
  remove:function(n){S.roster=S.roster.filter(function(r){return r.nick!==n});save();render();
    if(sb)sb.from("players").delete().eq("nick",n).then(function(){});
  },
  add:function(){
    if(!S.nick.trim())return;
    var np={nick:S.nick.trim(),name:S.name.trim()||"—",
      elo:parseInt(S.elo,10)||1500,record:"0V · 0S",delta:"nuovo",gender:S.gender};
    S.roster=S.roster.concat([np]).sort(function(a,b){return b.elo-a.elo});
    S.nick="";S.name="";S.elo="1500";S.gender="M";S.screen="rank";save();render();
    if(sb)sb.from("players").insert([{nick:np.nick,name:np.name,elo:np.elo,gender:np.gender,wins:0,losses:0,last_delta:"nuovo"}]).then(function(){});
  },
  pickGender:function(g){S.gender=g;save();render()},
  pickTourSize:function(n){S.tourSize=n;save();render()},
  pickTourType:function(v){S.tourType=v;save();render()},
  pickTourGender:function(v){S.tourGender=v;save();render()},
  pickTourPairMode:function(v){S.tourPairMode=v;save();render()},
  filterPool:function(gender){
    var roster=S.roster.slice().sort(function(a,b){return b.elo-a.elo});
    if(gender==="m")return roster.filter(function(r){return r.gender!=="F"});
    if(gender==="f")return roster.filter(function(r){return r.gender==="F"});
    return roster;
  },
  formTeams:function(gender,pairMode,size,selectedNicks){
    if(pairMode==="weak"){
      var p=A.filterPool(gender).slice(0,size),teams=[];
      for(var i=0;i<Math.floor(p.length/2);i++)teams.push([p[i].nick,p[p.length-1-i].nick]);
      return teams;
    }
    if(gender==="mixed"){
      var males=S.roster.filter(function(r){return r.gender!=="F"&&selectedNicks.indexOf(r.nick)!==-1}).sort(function(a,b){return b.elo-a.elo});
      var females=S.roster.filter(function(r){return r.gender==="F"&&selectedNicks.indexOf(r.nick)!==-1}).sort(function(a,b){return b.elo-a.elo});
      var n=Math.min(males.length,females.length),teams=[];
      for(var i=0;i<n;i++)teams.push([males[i].nick,females[i].nick]);
      return teams;
    }
    var p=S.roster.filter(function(r){return selectedNicks.indexOf(r.nick)!==-1}).sort(function(a,b){return b.elo-a.elo}),teams=[];
    for(var i=0;i<p.length;i+=2)if(p[i+1])teams.push([p[i].nick,p[i+1].nick]);
    return teams;
  },
  toggleTourPlayer:function(nick){S.tourSelected[nick]=!S.tourSelected[nick];save();render()},
  toggleTourPick:function(nick){
    if(S.tourPick===null){S.tourPick=nick;save();render();return;}
    if(S.tourPick===nick){S.tourPick=null;save();render();return;}
    S.tourTeams=S.tourTeams.concat([[S.tourPick,nick]]);S.tourPick=null;save();render();
  },
  unpairTourTeam:function(idx){S.tourTeams=S.tourTeams.filter(function(_,i){return i!==idx});save();render()},
  pickTourCourts:function(n){S.tourCourts=n;save();render()},
  pickTourDuration:function(v){S.tourDuration=v;save();render()},
  startMatchTimer:function(m){
    if(!S.tourDuration)return;
    if(m.timerRunning){
      m.timerRemainingMs=m.timerEndsAt-Date.now();m.timerRunning=false;m.timerPaused=true;
    }else if(m.timerPaused){
      m.timerEndsAt=Date.now()+m.timerRemainingMs;m.timerRunning=true;m.timerPaused=false;
    }else{
      m.timerEndsAt=Date.now()+S.tourDuration*60000;m.timerRunning=true;m.timerPaused=false;m.timerDone=false;
    }
    save();render();
  },
  beep:function(){
    try{
      var ctx=new (window.AudioContext||window.webkitAudioContext)();
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880;g.gain.value=0.2;
      o.start();setTimeout(function(){o.stop();ctx.close()},700);
    }catch(e){}
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
  },
  createTournament:function(){
    var showPicker=!(S.tourType==="elim"&&S.tourPairMode==="weak")&&S.tourType!=="americano";
    var selectedNicks=Object.keys(S.tourSelected).filter(function(n){return S.tourSelected[n]});
    if(showPicker&&S.tourTeams.length<2)return;
    if(showPicker&&S.tourType==="elim"){
      var teams=S.tourTeams.slice();
      var count=1;while(count*2<=teams.length)count*=2;
      var usable=teams.slice(0,count);
      var round0=[];
      for(var i=0;i<usable.length;i+=2)round0.push({a:usable[i],b:usable[i+1]||null,winner:null});
      var rounds=[round0],c=round0.length;
      while(c>1){c=c/2;var rr=[];for(var j=0;j<c;j++)rr.push({a:null,b:null,winner:null});rounds.push(rr);}
      S.tournament={type:"elim",rounds:rounds,courts:S.tourCourts,duration:S.tourDuration};S.screen="tour";save();render();
      return;
    }
    if(S.tourType==="americano"){
      var pool=A.filterPool(S.tourGender==="mixed"?"all":S.tourGender);
      var n=Math.min(pool.length,S.tourSize);n=n-(n%4);
      if(n<4)return;
      var base=pool.slice(0,n).map(function(p){return p.nick});
      var totalRounds=Math.min(n-1,5);
      var rounds=[];
      for(var r=0;r<totalRounds;r++){
        var rest=base.slice(1);
        var rot=r%rest.length;
        var rotated=[base[0]].concat(rest.slice(rot).concat(rest.slice(0,rot)));
        var matches=[];
        for(var g=0;g+4<=rotated.length;g+=4){
          var grp=rotated.slice(g,g+4);
          matches.push({a:[grp[0],grp[1]],b:[grp[2],grp[3]],winner:null});
        }
        rounds.push(matches);
      }
      S.tournament={type:"americano",rounds:rounds,courts:S.tourCourts,duration:S.tourDuration};S.screen="tour";save();render();
      return;
    }
    var teams=A.formTeams(S.tourGender,S.tourPairMode,S.tourSize,selectedNicks);
    var count=1;while(count*2<=teams.length)count*=2;
    var usable=teams.slice(0,count);
    if(usable.length<2)return;
    var round0=[];
    for(var i=0;i<usable.length;i+=2)round0.push({a:usable[i],b:usable[i+1]||null,winner:null});
    var rounds=[round0],c=round0.length;
    while(c>1){c=c/2;var rr=[];for(var j=0;j<c;j++)rr.push({a:null,b:null,winner:null});rounds.push(rr);}
    S.tournament={type:"elim",rounds:rounds,courts:S.tourCourts,duration:S.tourDuration};S.screen="tour";save();render();
  },
  newTournament:function(){S.tournament=null;save();render()},
  pickTourWinner:function(ri,mi,team){
    var rounds=S.tournament.rounds;
    rounds[ri][mi].winner=team;
    if(rounds[ri+1]){
      var next=rounds[ri+1][Math.floor(mi/2)];
      if(mi%2===0)next.a=team;else next.b=team;
    }
    save();render();
  },
  pickAmericanoWinner:function(ri,mi,key){
    S.tournament.rounds[ri][mi].winner=key;save();render();
  },
  pickMe:function(n){S.me=n;save();render()},
  changeMe:function(){S.me=null;save();render()},
  pickWinner:function(w){S.winner=w;save();render()},
  lockMatch:function(){
    var b=balanced();
    var teamA=b.teams[0].players.map(function(p){return{nick:p.nick,elo:p.elo}});
    var teamB=b.teams[1].players.map(function(p){return{nick:p.nick,elo:p.elo}});
    var match={id:Date.now(),day:S.day,slot:S.slot,court:S.court,stake:S.stake,
      teams:[{players:teamA},{players:teamB}]};
    S.matches=S.matches.concat([match]);S.stake="";S.pairSeed=0;S.selectedSlot=null;S.screen="home";save();render();
    if(sb)sb.from("matches").insert([{day:match.day,slot:match.slot,court:match.court,stake:match.stake,
      team_a:teamA,team_b:teamB}]).then(function(){});
  },
  goResultFor:function(id){S.activeMatchId=id;S.winner=null;S.screen="result";save();render();},
  submitResult:function(){
    if(!S.winner)return;
    var match=S.matches.filter(function(m){return m.id===S.activeMatchId})[0];
    if(!match)return;
    var winIdx=S.winner==="a"?0:1,loseIdx=S.winner==="a"?1:0;
    var winners=match.teams[winIdx].players.map(function(p){return p.nick});
    var losers=match.teams[loseIdx].players.map(function(p){return p.nick});
    var updates=[];
    S.roster=S.roster.map(function(r){
      var m,nr;
      if(winners.indexOf(r.nick)!==-1){
        m=(r.record||"0V · 0S").match(/\d+/g)||[0,0];
        nr=Object.assign({},r,{elo:r.elo+15,delta:"+15",record:(+m[0]+1)+"V · "+m[1]+"S"});
        updates.push({nick:r.nick,elo:nr.elo,wins:+m[0]+1,losses:+m[1],last_delta:"+15"});
        return nr;
      }
      if(losers.indexOf(r.nick)!==-1){
        m=(r.record||"0V · 0S").match(/\d+/g)||[0,0];
        nr=Object.assign({},r,{elo:Math.max(0,r.elo-15),delta:"-15",record:m[0]+"V · "+(+m[1]+1)+"S"});
        updates.push({nick:r.nick,elo:nr.elo,wins:+m[0],losses:+m[1]+1,last_delta:"-15"});
        return nr;
      }
      return r;
    }).sort(function(a,b){return b.elo-a.elo});
    var stakeText=match.stake.trim();
    if(stakeText)S.penalties=S.penalties.concat([{title:stakeText,who:losers.join(" e "),done:false}]);
    S.matches=S.matches.filter(function(m){return m.id!==match.id});
    S.winner=null;S.set1="";S.set2="";S.set3="";S.activeMatchId=null;S.screen="rank";save();render();
    if(sb){
      updates.forEach(function(u){sb.from("players").update({elo:u.elo,wins:u.wins,losses:u.losses,last_delta:u.last_delta}).eq("nick",u.nick).then(function(){})});
      if(stakeText)sb.from("penalties").insert([{title:stakeText,who:losers.join(" e "),done:false}]).then(function(){});
      sb.from("matches").delete().eq("id",match.id).then(function(){});
    }
  },
  pickStakeChip:function(l){S.stake=l;save();render()},
  togglePenalty:function(i){
    S.penalties[i].done=!S.penalties[i].done;save();render();
    var p=S.penalties[i];
    if(sb&&p.id)sb.from("penalties").update({done:p.done}).eq("id",p.id).then(function(){});
  },
  field:function(k,v){S[k]=v;save()}
};

  '<div class="tapmute" onclick="A.lockMatch()" style="background:#D6FF3D;color:#0D1411;border-radius:14px;'+
  'padding:17px;text-align:center;font-weight:700;font-size:16px">Blocca le coppie</div></div>';

  return '<div class="pad" style="gap:16px">'+

  '<div style="display:flex;flex-direction:column;gap:8px">'+rows+'</div></div>';
}

function me(){
  if(!S.me)return mePicker();
  var meP=S.roster.filter(function(r){return r.nick===S.me})[0]||{nick:"—",name:"—",elo:0,record:"0V · 0S"};
  var stats=[[String(meP.elo),"ELO attuale","#D6FF3D"],[meP.record,"Vinte / perse","#F4F1E6"],
    ["4","Volte campione","#D6FF3D"],["9","Sfottò incassati","#FF6A35"],["12","Birre dovute","#FF6A35"],
    ["19","Partite a sinistra","#F4F1E6"],["23","Partite a destra","#F4F1E6"],
    ["17","Partite maschile","#F4F1E6"],["0","Partite femminile","#F4F1E6"],["25","Partite misto","#F4F1E6"]]
    .map(function(s){return '<div style="background:#16201B;border:1px solid rgba(244,241,230,.1);'+
    'border-radius:14px;padding:14px 11px"><div class="anton" style="font-size:24px;color:'+s[2]+';line-height:1">'+s[0]+'</div>'+
    '<div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A9A8F;margin-top:6px;line-height:1.3">'+
    s[1]+'</div></div>'}).join("");
  var awards=[["1","Campione di maggio","primo posto ELO per 4 turni di fila"],
    ["M","Il Muro d'Onore","record: 41 palle rimesse in uno scambio"],
    ["P","Puntualità svizzera","10 partite senza un ritardo"]].map(function(a){
    return '<div style="display:flex;gap:12px;align-items:center;background:#131C17;'+
    'border:1px solid rgba(214,255,61,.22);border-radius:12px;padding:13px">'+
    '<div style="width:32px;height:32px;border-radius:8px;background:rgba(214,255,61,.16);color:#D6FF3D;'+
    'display:grid;place-items:center;font-size:14px;font-weight:700">'+a[0]+'</div>'+
    '<div style="flex:1"><div style="font-size:14px;font-weight:700">'+esc(a[1])+'</div>'+
    '<div style="font-size:11px;color:#8A9A8F">'+esc(a[2])+'</div></div></div>'}).join("");
  var pens=S.penalties.map(function(p,i){var d=p.done;
    return '<div class="tapmute" onclick="A.togglePenalty('+i+')" style="display:flex;gap:12px;align-items:center;'+
    'background:#131C17;border:1px solid '+(d?"rgba(244,241,230,.1)":"rgba(255,106,53,.35)")+
    ';border-radius:12px;padding:15px 13px">'+
    '<div style="width:22px;height:22px;border-radius:6px;border:1px solid '+(d?"#D6FF3D":"rgba(244,241,230,.3)")+
    ';background:'+(d?"#D6FF3D":"transparent")+';color:#0D1411;display:grid;place-items:center;'+
    'font-size:13px;font-weight:700">'+(d?"✓":"")+'</div>'+
    '<div style="flex:1;font-size:14px;font-weight:700;color:'+(d?"#6C7A70":"#F4F1E6")+
    ';text-decoration:'+(d?"line-through":"none")+'">'+esc(p.title)+'</div>'+
    '<div style="font-size:11px;color:#8A9A8F">'+esc(p.who)+'</div></div>'}).join("");
  return '<div class="pad">'+
  '<div style="display:flex;gap:14px;align-items:center">'+
  '<div class="anton" style="width:68px;height:68px;border-radius:18px;'+
  'background:linear-gradient(160deg,#D6FF3D,#7FBF1F);color:#0D1411;display:grid;place-items:center;font-size:20px">'+esc(meP.nick)+'</div>'+
  '<div style="flex:1"><div class="anton" style="font-size:30px;line-height:1">'+esc(meP.nick)+'</div>'+
  '<div style="font-size:12px;color:#8A9A8F;margin-top:4px">'+esc(meP.name)+'</div></div>'+
  '<div class="tapmute" onclick="A.changeMe()" style="font-size:12px;color:#8A9A8F;text-decoration:underline">cambia</div></div>'+
  '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+stats+'</div>'+
  '<div><div class="kick" style="color:#D6FF3D;margin-bottom:10px">Bacheca premi</div>'+
  '<div style="display:flex;flex-direction:column;gap:8px">'+awards+'</div></div>'+
  '<div><div class="kick" style="color:#FF6A35;margin-bottom:10px">Penitenze</div>'+
  '<div style="display:flex;flex-direction:column;gap:8px">'+pens+'</div></div></div>';
}

function fmtTime(ms){var s=Math.max(0,Math.ceil(ms/1000));var m=Math.floor(s/60),sec=s%60;return m+":"+(sec<10?"0":"")+sec}
function checkMatchTimer(m){
  if(!m.timerRunning)return;
  if(m.timerEndsAt-Date.now()<=0&&!m.timerDone){A.beep();m.timerRunning=false;m.timerDone=true;save();}
}
function timerHtml(m,onStart){
  if(!S.tourDuration)return "";
  if(m.winner)return "";
  checkMatchTimer(m);
  var big=m.timerRunning||m.timerDone||m.timerPaused;
  var label=m.timerRunning?fmtTime(m.timerEndsAt-Date.now()):m.timerPaused?fmtTime(m.timerRemainingMs)+" · in pausa":m.timerDone?"TEMPO!":"⏱ Avvia cronometro";
  var color=m.timerDone?"#FF6A35":"#F4F1E6";
  if(m.timerRunning)color="#0D1411";
  var bg=m.timerDone?"#FF6A35":m.timerRunning?"#D6FF3D":m.timerPaused?"#3A3420":"#16201B";
  var border=m.timerDone?"#FF6A35":m.timerRunning?"#D6FF3D":m.timerPaused?"#D6B23D":"rgba(244,241,230,.16)";
  return '<div class="tapmute" onclick="'+onStart+'" style="text-align:center;'+
  (big?'font-family:Anton,sans-serif;font-size:32px;letter-spacing:.02em;':'font-size:13px;')+
  'font-weight:700;color:'+color+';background:'+bg+';border:1px solid '+border+';border-radius:12px;'+
  'padding:'+(big?"10px 0":"10px")+'">'+label+'</div>';
}
var _timerLoopStarted=false;
function ensureTimerLoop(){
  if(_timerLoopStarted)return;_timerLoopStarted=true;
  setInterval(function(){
    if(S.screen!=="tour"||!S.tournament)return;
    var running=S.tournament.rounds.some(function(round){return round.some(function(m){return m.timerRunning})});
    if(running)render();
  },1000);
}
function tour(){
  if(!S.tournament){
    var types=[["elim","Eliminazione"],["americano","All'americana"]].map(function(t){var on=S.tourType===t[0];
      return '<div class="tapmute" onclick="A.pickTourType(\''+t[0]+'\')" style="flex:1;text-align:center;border-radius:12px;'+
      'padding:14px 0;background:'+(on?"#D6FF3D":"#16201B")+';border:1px solid '+(on?"#D6FF3D":"rgba(244,241,230,.16)")+
      ';color:'+(on?"#0D1411":"#F4F1E6")+';font-weight:700;font-size:14px">'+t[1]+'</div>'}).join("");
    var genders=[["all","Tutti"],["m","Maschile"],["f","Femminile"],["mixed","Misto"]].map(function(t){var on=S.tourGender===t[0];
      return '<div class="tapmute" onclick="A.pickTourGender(\''+t[0]+'\')" style="flex:1;min-width:70px;text-align:center;border-radius:12px;'+
      'padding:12px 0;background:'+(on?"#D6FF3D":"#16201B")+';border:1px solid '+(on?"#D6FF3D":"rgba(244,241,230,.16)")+
      ';color:'+(on?"#0D1411":"#F4F1E6")+';font-weight:700;font-size:13px">'+t[1]+'</div>'}).join("");
    var pairModeHtml="";
    if(S.tourType==="elim"&&S.tourGender!=="mixed"){
      var modes=[["balanced","Bilanciate"],["weak","Scarsi contro scarsoni"]].map(function(t){var on=S.tourPairMode===t[0];
        return '<div class="tapmute" onclick="A.pickTourPairMode(\''+t[0]+'\')" style="flex:1;text-align:center;border-radius:12px;'+
        'padding:12px 8px;background:'+(on?"#D6FF3D":"#16201B")+';border:1px solid '+(on?"#D6FF3D":"rgba(244,241,230,.16)")+
        ';color:'+(on?"#0D1411":"#F4F1E6")+';font-weight:700;font-size:12px">'+t[1]+'</div>'}).join("");
      pairModeHtml='<div><div class="kick" style="margin-bottom:10px">Squadre</div><div style="display:flex;gap:8px">'+modes+'</div></div>';
    }
    var courts=[1,2,3,4].map(function(n){var on=S.tourCourts===n;
      return '<div class="tapmute" onclick="A.pickTourCourts('+n+')" style="flex:1;text-align:center;border-radius:12px;'+
      'padding:12px 0;background:'+(on?"#D6FF3D":"#16201B")+';border:1px solid '+(on?"#D6FF3D":"rgba(244,241,230,.16)")+
      ';color:'+(on?"#0D1411":"#F4F1E6")+';font-weight:700;font-size:14px">'+n+'</div>'}).join("");
    var courtsHtml='<div><div class="kick" style="margin-bottom:10px">Quanti campi?</div><div style="display:flex;gap:8px">'+courts+'</div></div>';
    var durs=[[null,"Nessuno"],[15,"15 min"],[20,"20 min"],[30,"30 min"]].map(function(t){var on=S.tourDuration===t[0];
      return '<div class="tapmute" onclick="A.pickTourDuration('+(t[0]===null?"null":t[0])+')" style="flex:1;text-align:center;border-radius:12px;'+
      'padding:12px 4px;background:'+(on?"#D6FF3D":"#16201B")+';border:1px solid '+(on?"#D6FF3D":"rgba(244,241,230,.16)")+
      ';color:'+(on?"#0D1411":"#F4F1E6")+';font-weight:700;font-size:12px">'+t[1]+'</div>'}).join("");
    var durHtml='<div><div class="kick" style="margin-bottom:10px">Durata match</div><div style="display:flex;gap:8px">'+durs+'</div></div>';
    var sizeHtml="";
    var showSizeChips=S.tourGender!=="mixed"&&(S.tourType==="americano"||S.tourPairMode==="weak");
    if(showSizeChips){
      var sizes=[4,8,16].map(function(n){var on=S.tourSize===n;
        return '<div class="tapmute" onclick="A.pickTourSize('+n+')" style="flex:1;text-align:center;border-radius:12px;'+
        'padding:14px 0;background:'+(on?"#D6FF3D":"#16201B")+';border:1px solid '+(on?"#D6FF3D":"rgba(244,241,230,.16)")+
        ';color:'+(on?"#0D1411":"#F4F1E6")+';font-weight:700;font-size:15px">'+n+'</div>'}).join("");
      sizeHtml='<div><div class="kick" style="margin-bottom:10px">Quanti giocatori?</div><div style="display:flex;gap:8px">'+sizes+'</div></div>';
    }
    var pickerHtml="";
    var showPicker=!(S.tourType==="elim"&&S.tourPairMode==="weak")&&S.tourType!=="americano";
    if(showPicker){
      var pool=A.filterPool(S.tourGender==="mixed"?"all":S.tourGender);
      var count=Object.keys(S.tourSelected).filter(function(n){return S.tourSelected[n]}).length;
      var rows=pool.map(function(r){var checked=!!S.tourSelected[r.nick];
        return '<div class="tapmute" onclick="A.toggleTourPlayer(\''+r.nick.replace(/'/g,"\\'")+'\')" style="display:flex;align-items:center;gap:12px;'+
        'background:'+(checked?"rgba(214,255,61,.1)":"#16201B")+';border:1px solid '+(checked?"rgba(214,255,61,.4)":"rgba(244,241,230,.1)")+
        ';border-radius:10px;padding:11px 13px">'+
        '<div style="width:18px;height:18px;border-radius:5px;border:1px solid '+(checked?"#D6FF3D":"rgba(244,241,230,.3)")+
        ';background:'+(checked?"#D6FF3D":"transparent")+';color:#0D1411;display:grid;place-items:center;font-size:11px;font-weight:700">'+
        (checked?"✓":"")+'</div>'+
        '<div style="flex:1;font-size:14px;font-weight:700">'+esc(r.nick)+'</div>'+
        '<div style="font-size:12px;color:#8A9A8F">'+r.elo+'</div></div>'}).join("");
      pickerHtml='<div><div class="kick" style="margin-bottom:10px">Chi partecipa? ('+count+' selezionati, min. 4)</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px">'+rows+'</div></div>';
    }
    var builderHtml="";
    var selCount=Object.keys(S.tourSelected).filter(function(n){return S.tourSelected[n]}).length;
    if(showPicker&&selCount>=4){
      var selectedNicks=Object.keys(S.tourSelected).filter(function(n){return S.tourSelected[n]});
      var paired={};S.tourTeams.forEach(function(t){paired[t[0]]=true;paired[t[1]]=true});
      var unpaired=S.roster.filter(function(r){return selectedNicks.indexOf(r.nick)!==-1&&!paired[r.nick]});
      var chips=unpaired.map(function(r){var sel=S.tourPick===r.nick;
        return '<div class="tapmute" onclick="A.toggleTourPick(\''+r.nick.replace(/'/g,"\\'")+'\')" style="background:'+
        (sel?"rgba(214,255,61,.16)":"#16201B")+';border:1px solid '+(sel?"#D6FF3D":"rgba(244,241,230,.12)")+
        ';border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700">'+esc(r.nick)+'</div>'}).join("");
      var hint=S.tourPick?"Tocca chi forma coppia con "+S.tourPick:"Tocca due giocatori per formare una coppia.";
      var teamsHtml="";
      if(S.tourTeams.length){
        teamsHtml='<div><div class="kick" style="color:#D6FF3D;margin-bottom:10px">Coppie formate</div>'+
        '<div style="display:flex;flex-direction:column;gap:8px">'+S.tourTeams.map(function(t,i){
          return '<div style="display:flex;justify-content:space-between;align-items:center;background:#131C17;'+
          'border:1px solid rgba(214,255,61,.22);border-radius:10px;padding:12px 14px">'+
          '<div style="font-size:14px;font-weight:700">'+esc(t.join(" / "))+'</div>'+
          '<div class="tapmute" onclick="A.unpairTourTeam('+i+')" style="color:#8A9A8F;font-size:16px">\u00d7</div></div>'}).join("")+'</div></div>';
      }
      builderHtml='<div><div class="kick" style="margin-bottom:10px">'+hint+'</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px">'+chips+'</div></div>'+teamsHtml;
    }
    return '<div class="pad">'+
    '<div style="font-size:13px;color:#8A9A8F;line-height:1.5">Crea un torneo: eliminazione diretta a coppie fisse, o all\'americana con partner a rotazione.</div>'+
    '<div><div class="kick" style="margin-bottom:10px">Formato</div><div style="display:flex;gap:8px">'+types+'</div></div>'+
    '<div><div class="kick" style="margin-bottom:10px">Partecipanti</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+genders+'</div></div>'+
    pairModeHtml+courtsHtml+durHtml+sizeHtml+pickerHtml+builderHtml+
    '<div class="tapmute" onclick="A.createTournament()" style="background:#D6FF3D;color:#0D1411;border-radius:14px;padding:17px;'+
    'text-align:center;font-weight:700;font-size:16px">Crea torneo</div></div>';
  }
  if(S.tournament.type==="americano"){
    var pts={};
    S.tournament.rounds.forEach(function(round){round.forEach(function(m){
      var winTeam=m.winner==="a"?m.a:m.winner==="b"?m.b:null;
      var loseTeam=m.winner==="a"?m.b:m.winner==="b"?m.a:null;
      if(winTeam)winTeam.forEach(function(n){pts[n]=(pts[n]||0)+1});
      if(loseTeam)loseTeam.forEach(function(n){pts[n]=pts[n]||0});
    })});
    var standings=Object.keys(pts).sort(function(a,b){return pts[b]-pts[a]});
    var standingsHtml=standings.map(function(nick,i){
      return '<div style="display:flex;align-items:center;gap:12px;background:#131C17;border:1px solid rgba(244,241,230,.08);'+
      'border-radius:10px;padding:10px 13px">'+
      '<div class="anton" style="width:20px;font-size:15px;color:#8A9A8F">'+(i+1)+'</div>'+
      '<div style="flex:1;font-size:14px;font-weight:700">'+esc(nick)+'</div>'+
      '<div style="font-size:13px;color:#D6FF3D;font-weight:700">'+pts[nick]+' pt</div></div>'}).join("");
    var roundsHtml=S.tournament.rounds.map(function(round,ri){
      var matches=round.map(function(m,mi){var aSel=m.winner==="a",bSel=m.winner==="b";
        return '<div style="display:flex;gap:8px">'+
        '<div class="tapmute" onclick="A.pickAmericanoWinner('+ri+','+mi+',\'a\')" style="flex:1;background:'+
        (aSel?"rgba(214,255,61,.14)":"#16201B")+';border:1px solid '+(aSel?"#D6FF3D":"rgba(244,241,230,.1)")+
        ';border-radius:10px;padding:12px;text-align:center;font-size:12px;font-weight:700">'+esc(m.a.join(" / "))+'</div>'+
        '<div class="tapmute" onclick="A.pickAmericanoWinner('+ri+','+mi+',\'b\')" style="flex:1;background:'+
        (bSel?"rgba(214,255,61,.14)":"#16201B")+';border:1px solid '+(bSel?"#D6FF3D":"rgba(244,241,230,.1)")+
        ';border-radius:10px;padding:12px;text-align:center;font-size:12px;font-weight:700">'+esc(m.b.join(" / "))+'</div></div>'+
        timerHtml(m,"A.startMatchTimer(S.tournament.rounds["+ri+"]["+mi+"])")}).join("");
      return '<div><div class="kick" style="margin-bottom:10px">Turno '+(ri+1)+'</div>'+
      '<div style="display:flex;flex-direction:column;gap:8px">'+matches+'</div></div>'}).join("");
    ensureTimerLoop();
    return '<div class="pad">'+
    '<div style="font-size:12px;color:#8A9A8F">Campi: '+S.tournament.courts+(S.tournament.duration?" · Match a "+S.tournament.duration+" min":" · Nessun limite di tempo")+'</div>'+
    '<div class="kick">Classifica torneo</div>'+
    '<div style="display:flex;flex-direction:column;gap:6px">'+standingsHtml+'</div>'+
    roundsHtml+
    '<div class="tapmute" onclick="A.newTournament()" style="text-align:center;font-size:13px;color:#8A9A8F;padding:8px;text-decoration:underline">Nuovo torneo</div></div>';
  }
  var rounds=S.tournament.rounds;
  var champion=null;
  var last=rounds[rounds.length-1];
  if(last&&last[0]&&last[0].winner)champion=last[0].winner.join(" / ");
  var champHtml=champion?('<div style="background:linear-gradient(160deg,#16281F,#101A15);border:1px solid rgba(214,255,61,.4);'+
    'border-radius:16px;padding:18px;text-align:center">'+
    '<div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#D6FF3D">Campione del torneo</div>'+
    '<div class="anton" style="font-size:24px;margin-top:8px">'+esc(champion)+'</div></div>'):"";
  var roundsHtml=rounds.map(function(round,ri){
    var label=ri===rounds.length-1?"Finale":"Turno "+(ri+1);
    var matches=round.map(function(m,mi){
      var canPick=!!m.a&&!!m.b&&!m.winner;
      var aSel=m.winner===m.a,bSel=m.winner===m.b;
      var aLabel=m.a?m.a.join(" / "):"—",bLabel=m.b?m.b.join(" / "):"—";
      return '<div style="display:flex;gap:8px">'+
      '<div '+(canPick?'class="tapmute" onclick="A.pickTourWinner('+ri+','+mi+',JSON.parse(this.dataset.team))" data-team=\''+JSON.stringify(m.a)+'\'':'')+
      ' style="flex:1;background:'+(aSel?"rgba(214,255,61,.14)":"#16201B")+';border:1px solid '+
      (aSel?"#D6FF3D":"rgba(244,241,230,.1)")+';border-radius:10px;padding:12px;text-align:center;font-size:13px;font-weight:700">'+
      esc(aLabel)+'</div>'+
      '<div '+(canPick?'class="tapmute" onclick="A.pickTourWinner('+ri+','+mi+',JSON.parse(this.dataset.team))" data-team=\''+JSON.stringify(m.b)+'\'':'')+
      ' style="flex:1;background:'+(bSel?"rgba(214,255,61,.14)":"#16201B")+';border:1px solid '+
      (bSel?"#D6FF3D":"rgba(244,241,230,.1)")+';border-radius:10px;padding:12px;text-align:center;font-size:13px;font-weight:700">'+
      esc(bLabel)+'</div></div>'+
      timerHtml(m,'A.startMatchTimer(S.tournament.rounds['+ri+']['+mi+'])')}).join("");
    return '<div><div class="kick" style="margin-bottom:10px">'+label+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px">'+matches+'</div></div>'}).join("");
  ensureTimerLoop();
  return '<div class="pad">'+
  '<div style="font-size:12px;color:#8A9A8F;margin-bottom:8px">Campi: '+S.tournament.courts+(S.tournament.duration?" · Match a "+S.tournament.duration+" min":" · Nessun limite di tempo")+'</div>'+
  champHtml+roundsHtml+
  '<div class="tapmute" onclick="A.newTournament()" style="text-align:center;font-size:13px;color:#8A9A8F;padding:8px;text-decoration:underline">Nuovo torneo</div></div>';
}

function tabs(){
  return '<div style="display:flex;border-top:1px solid rgba(244,241,230,.1);background:rgba(11,17,14,.98);'+
  'padding:8px 4px calc(env(safe-area-inset-bottom) + 8px);flex-shrink:0">'+
  [["home","Gabbia","6px"],["book","Prenota","50%"],["pairs","Coppie","3px"],
   ["rank","Classifica","6px"],["tour","Torneo","3px"],["me","Io","50%"]].map(function(t){
    var on=S.screen===t[0]||(t[0]==="rank"&&(S.screen==="add"||S.screen==="result"));
    return '<div class="tapmute" onclick="A.nav(\''+t[0]+'\')" style="flex:1;display:flex;flex-direction:column;'+
    'align-items:center;gap:6px;padding:8px 0;min-height:44px;color:'+(on?"#D6FF3D":"#6C7A70")+'">'+
    '<div style="width:20px;height:20px;border-radius:'+t[2]+';border:2px solid currentColor;background:'+
    (on?"#D6FF3D":"transparent")+'"></div>'+
    '<div style="font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:700">'+t[1]+'</div></div>'
  }).join("")+'</div>';
}

function render(){
  var body={home:home,book:book,pairs:pairs,rank:rank,add:addScreen,me:me,result:resultScreen,tour:tour}[S.screen]||home;
  document.getElementById("app").innerHTML=header()+'<div class="scroll">'+body()+'</div>'+tabs();
}
render();
initSync();
</script>
</body>
