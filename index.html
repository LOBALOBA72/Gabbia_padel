function flagOf(code){
  if(!code||String(code).length!==2)return "";
  return String.fromCodePoint.apply(null,String(code).toUpperCase().split("").map(function(c){
    return 0x1F1E6+c.charCodeAt(0)-65}));
}

/* --- identità: S.me è l'id Supabase, con fallback sul nick per i vecchi salvataggi --- */
function myPlayer(){
  if(!S.me)return null;
  var byId=S.roster.filter(function(p){return p.id&&p.id===S.me})[0];
  if(byId)return byId;
  return S.roster.filter(function(p){return p.nick===S.me})[0]||null;
}
function isMe(p){var m=myPlayer();return !!m&&!!p&&m.nick===p.nick}
/* amministratore: chi ha il flag is_admin sul proprio profilo (oggi solo MASSICCIO),
   oppure chi ha sbloccato con il PIN — tenuto come riserva */
function isAdminUser(){
  var m=myPlayer();
  return S.isAdmin===true||!!(m&&m.isAdmin===true);
}
function myNick(){var m=myPlayer();return m?m.nick:null}
/* aggancia S.me all'id vero appena il roster arriva da Supabase */
function upgradeMeToId(){
  var m=myPlayer();
  if(m&&m.id&&S.me!==m.id){S.me=m.id;save()}
}

/* --- ELO vero: punteggio atteso + K-factor, a somma zero --- */
var ELO_K=32;
function eloExpected(a,b){return 1/(1+Math.pow(10,(b-a)/400))}
function avg(list){if(!list.length)return 1500;return list.reduce(function(s,v){return s+v},0)/list.length}
/* quanti punti passano dai perdenti ai vincitori */
function eloSwing(winAvg,loseAvg){return Math.max(1,Math.round(ELO_K*(1-eloExpected(winAvg,loseAvg))))}

/* --- date reali --- */
function dowIndex(d){return (d.getDay()+6)%7}
function upcomingDays(n){
  var base=new Date();base.setHours(0,0,0,0);var out=[];
  for(var i=0;i<n;i++){var d=new Date(base.getTime()+i*86400000);
    out.push({dow:dowIndex(d),num:d.getDate(),iso:d.toISOString().slice(0,10)})}
  return out;
}

function applyPlayers(rows){
  S.roster=rows.map(function(r){return{id:r.id,nick:r.nick,name:r.name,elo:r.elo,gender:r.gender,photo:r.photo||null,
    nationality:r.nationality||"",isAdmin:r.is_admin===true,
    record:(r.wins||0)+"V · "+(r.losses||0)+"S",delta:r.last_delta||""}}).sort(function(a,b){return b.elo-a.elo});
  upgradeMeToId();
  save();
}
function applyMatches(rows){
  var all=rows.map(function(r){return{id:r.id,day:r.day,slot:r.slot,court:r.court,stake:r.stake||"",
    winner:r.winner||null,playedAt:r.played_at||null,score:r.score||"",
    proposedBy:r.proposed_by||null,confirmations:r.confirmations||null,
    teams:[{players:r.team_a},{players:r.team_b}]}});
  /* una partita è "in sospeso" finché non ha una data di gioco */
  S.matches=all.filter(function(m){return !m.playedAt});
  S.history=all.filter(function(m){return m.playedAt})
    .sort(function(a,b){return a.playedAt<b.playedAt?1:-1});
  save();
}
function applyPenalties(rows){
  S.penalties=rows.map(function(r){return{id:r.id,title:r.title,who:r.who,done:r.done}});
  save();
}
function applyTournaments(rows){
  var live=(rows||[]).filter(function(r){return r.status==="active"})[0];
  if(!live){
    /* un torneo senza id è solo locale (baraonda): non lo tocchiamo */
    if(S.tournament&&S.tournament.id)S.tournament=null;
    save();return;
  }
  var champion=S.tournament&&S.tournament.id===live.id?S.tournament.champion:null;
  S.tournament={id:live.id,type:live.type,rounds:live.rounds||[],
    courts:live.courts||2,duration:live.duration_min,champion:champion};
  save();
}
async function refetch(table){
  if(!sb)return;
  var col=table==="players"?"elo":"created_at",asc=table!=="players";
  var res=await sb.from(table).select("*").order(col,{ascending:asc});
  if(res.error)return;
  if(table==="players")applyPlayers(res.data);
  if(table==="matches")applyMatches(res.data);
  if(table==="penalties")applyPenalties(res.data);
  if(table==="tournaments")applyTournaments(res.data);
  render();
}

  }catch(e){}
}

/* i 4 in campo, risolti sul roster vero: gli slot che puntano a un nick
   inesistente vengono riempiti con i giocatori ancora liberi */
function lineupPlayers(){
  var byNick={};S.roster.forEach(function(p){byNick[p.nick]=p});
  var free=S.roster.filter(function(p){return S.lineup.indexOf(p.nick)===-1});
  var used={},out=[],fi=0;
  for(var i=0;i<4;i++){
    var p=byNick[S.lineup[i]];
    if(!p||used[p.nick])p=free[fi++]||null;
    if(!p)p={nick:"—",name:"posto libero",elo:1500,placeholder:true};
    used[p.nick]=true;out.push(p);
  }
  var nicks=out.map(function(p){return p.nick});
  if(nicks.join("|")!==S.lineup.join("|")){S.lineup=nicks;save()}
  return out;
}
/* chi è già impegnato in una partita confermata in quel giorno e orario */
/* ---- stato di una partita rispetto alla conferma del risultato ----
   nessun winner          -> "da giocare"
   winner + played_at null -> "proposto", in attesa che tutti confermino
   played_at valorizzato   -> chiusa, ELO già assegnato (sta nello storico) */
function matchNicks(m){
  return m.teams[0].players.concat(m.teams[1].players).map(function(p){return p.nick});
}
function pendingVoters(m){
  var c=m.confirmations||{};
  return matchNicks(m).filter(function(n){return c[n]!==true});
}
function isProposed(m){return !!m.winner&&!m.playedAt}
/* tocca a me votare? */
function needsMyVote(m){
  var n=myNick();
  return isProposed(m)&&!!n&&matchNicks(m).indexOf(n)!==-1&&(m.confirmations||{})[n]!==true;
}
function busyNicks(day,slot){
  var out={};
  S.matches.forEach(function(m){
    if(m.day!==day||m.slot!==slot)return;
    m.teams[0].players.concat(m.teams[1].players).forEach(function(p){out[p.nick]=true});
  });
  return out;
}
function balanced(){
  var swap=S.sideSwap||{};
  var pool=lineupPlayers();
  var combos=[[0,1,2,3],[0,2,1,3],[0,3,1,2]];
  var sc=combos.map(function(c){var a=pool[c[0]].elo+pool[c[1]].elo,b=pool[c[2]].elo+pool[c[3]].elo;
    return{c:c,diff:Math.abs(a-b),a:a,b:b}}).sort(function(x,y){return x.diff-y.diff});
  var p=sc[S.pairSeed%sc.length];
  var t0=swap[0]?[pool[p.c[1]],pool[p.c[0]]]:[pool[p.c[0]],pool[p.c[1]]];
  var t1=swap[1]?[pool[p.c[3]],pool[p.c[2]]]:[pool[p.c[2]],pool[p.c[3]]];
  return{diff:p.diff,teams:[{players:t0,sum:p.a},{players:t1,sum:p.b}]};
}

        if(wasSignup){S.me=np.id;}

      };
      /* se la colonna nationality non esiste ancora, si reinserisce senza */
      sb.from("players").insert([Object.assign({},base,{nationality:np.nationality})]).select()
        .then(function(res){
          if(res.error)sb.from("players").insert([base]).select().then(fatto);
          else fatto(res);
        });
    }
  },
  startSignup:function(){S.addAsMe=true;S.screen="add";save();render();},
  cancelAdd:function(){var wasSignup=S.addAsMe;S.addAsMe=false;S.screen=wasSignup?"me":"rank";save();render();},

  setPhoto:function(input){
    var file=input.files&&input.files[0];if(!file)return;
    var meP=myPlayer();if(!meP)return;
    var reader=new FileReader();
    reader.onload=function(e){
      /* ridimensiona prima di salvare: una foto da telefono è troppo pesante per una colonna di testo */
      var img=new Image();
      img.onload=function(){
        var MAX=720,sc=Math.min(1,MAX/Math.max(img.width,img.height));
        var c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        var data;
        try{data=c.toDataURL("image/jpeg",0.82)}catch(err){data=e.target.result}
        A.storePhoto(meP,data);
      };
      img.onerror=function(){A.storePhoto(meP,e.target.result)};
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  },

    });
  },

  filterPool:function(gender){
    var roster=S.roster.slice().sort(function(a,b){return b.elo-a.elo});
    if(gender==="m")return roster.filter(function(r){return r.gender!=="F"});
    if(gender==="f")return roster.filter(function(r){return r.gender==="F"});
    return roster;
  },
  formTeams:function(gender,pairMode,size,selectedNicks){
    if(pairMode==="weak"){
      var p=A.filterPool(gender).slice(0,size),teams=[];
      for(var i=0;i<Math.floor(p.length/2);i++)teams.push([p[i].nick,p[p.length-1-i].nick]);
      return teams;
    }
    if(gender==="mixed"){
      var males=S.roster.filter(function(r){return r.gender!=="F"&&selectedNicks.indexOf(r.nick)!==-1}).sort(function(a,b){return b.elo-a.elo});
      var females=S.roster.filter(function(r){return r.gender==="F"&&selectedNicks.indexOf(r.nick)!==-1}).sort(function(a,b){return b.elo-a.elo});
      var n=Math.min(males.length,females.length),teams=[];
      for(var i=0;i<n;i++)teams.push([males[i].nick,females[i].nick]);
      return teams;
    }
    var p=S.roster.filter(function(r){return selectedNicks.indexOf(r.nick)!==-1}).sort(function(a,b){return b.elo-a.elo}),teams=[];
    for(var i=0;i<p.length;i+=2)if(p[i+1])teams.push([p[i].nick,p[i+1].nick]);
    return teams;
  },
  toggleTourPlayer:function(nick){

    if(S.tourPick===nick){S.tourPick=null;save();render();return;}

  startMatchTimer:function(m){
    /* la durata è quella del torneo in corso, non l'ultima scelta nel form */
    var dur=S.tournament&&S.tournament.duration;
    if(!dur)return;
    if(m.timerRunning){
      m.timerRemainingMs=m.timerEndsAt-Date.now();m.timerRunning=false;m.timerPaused=true;
    }else if(m.timerPaused){
      m.timerEndsAt=Date.now()+m.timerRemainingMs;m.timerRunning=true;m.timerPaused=false;
    }else{
      m.timerEndsAt=Date.now()+dur*60000;m.timerRunning=true;m.timerPaused=false;m.timerDone=false;
    }
    save();render();pushTournament();
  },
  beep:function(){
    try{
      var ctx=new (window.AudioContext||window.webkitAudioContext)();
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880;g.gain.value=0.2;
      o.start();setTimeout(function(){o.stop();ctx.close()},700);
    }catch(e){}
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
  },
  createTournament:function(){
    var showPicker=!(S.tourType==="elim"&&S.tourPairMode==="weak");
    var selectedNicks=Object.keys(S.tourSelected).filter(function(n){return S.tourSelected[n]});
    if(showPicker&&S.tourType==="elim"&&S.tourTeams.length<2)return;
    if(showPicker&&S.tourType==="elim"){
      var teams=S.tourTeams.filter(function(t){return selectedNicks.indexOf(t[0])!==-1&&selectedNicks.indexOf(t[1])!==-1});
      var count=1;while(count*2<=teams.length)count*=2;
      var usable=teams.slice(0,count);
      var round0=[];
      for(var i=0;i<usable.length;i+=2)round0.push({a:usable[i],b:usable[i+1]||null,winner:null});
      var rounds=[round0],c=round0.length;
      while(c>1){c=c/2;var rr=[];for(var j=0;j<c;j++)rr.push({a:null,b:null,winner:null});rounds.push(rr);}
      startTournament({type:"elim",rounds:rounds,courts:S.tourCourts,duration:S.tourDuration});
      return;
    }
    if(S.tourType==="americano"){
      var pool=A.filterPool(S.tourGender==="mixed"?"all":S.tourGender).filter(function(p){return selectedNicks.indexOf(p.nick)!==-1});
      var n=pool.length;n=n-(n%4);
      if(n<4)return;
      var base=pool.slice(0,n).map(function(p){return p.nick});
      var totalRounds=Math.min(n-1,5);
      var rounds=[];
      for(var r=0;r<totalRounds;r++){
        var rest=base.slice(1);
        var rot=r%rest.length;
        var rotated=[base[0]].concat(rest.slice(rot).concat(rest.slice(0,rot)));
        var matches=[];
        for(var g=0;g+4<=rotated.length;g+=4){
          var grp=rotated.slice(g,g+4);
          matches.push({a:[grp[0],grp[1]],b:[grp[2],grp[3]],winner:null});
        }
        rounds.push(matches);
      }
      startTournament({type:"americano",rounds:rounds,courts:S.tourCourts,duration:S.tourDuration});
      return;
    }
    if(S.tourType==="baraonda"){
      var pool=A.filterPool(S.tourGender==="mixed"?"all":S.tourGender).filter(function(p){return selectedNicks.indexOf(p.nick)!==-1}).map(function(p){return p.nick});
      var count=1;while(count*2<=pool.length)count*=2;
      if(count<4)return;
      var usable=pool.slice(0,count);
      startTournament({type:"baraonda",rounds:[genBaraondaRound(usable)],courts:S.tourCourts,duration:S.tourDuration,champion:null});
      return;
    }
    var teams=A.formTeams(S.tourGender,S.tourPairMode,S.tourSize,selectedNicks);
    var count=1;while(count*2<=teams.length)count*=2;
    var usable=teams.slice(0,count);
    if(usable.length<2)return;
    var round0=[];
    for(var i=0;i<usable.length;i+=2)round0.push({a:usable[i],b:usable[i+1]||null,winner:null});
    var rounds=[round0],c=round0.length;
    while(c>1){c=c/2;var rr=[];for(var j=0;j<c;j++)rr.push({a:null,b:null,winner:null});rounds.push(rr);}
    startTournament({type:"elim",rounds:rounds,courts:S.tourCourts,duration:S.tourDuration});
  },
  newTournament:function(){
    var old=S.tournament;
    S.tournament=null;S.tourSelected={};S.tourTeams=[];S.tourPick=null;save();render();
    if(sb&&old&&old.id)sb.from("tournaments").update({status:"done"}).eq("id",old.id).then(function(){});

  pickTourWinner:function(ri,mi,team){
    var rounds=S.tournament.rounds;
    rounds[ri][mi].winner=team;
    if(rounds[ri+1]){
      var next=rounds[ri+1][Math.floor(mi/2)];
      if(mi%2===0)next.a=team;else next.b=team;
    }
    save();render();pushTournament();
  },
  pickAmericanoWinner:function(ri,mi,key){

  },
  pickBaraondaWinner:function(ri,mi,team){
    var round=S.tournament.rounds[ri];
    round[mi].winner=team;
    if(round.every(function(m){return m.winner})){
      var advancing=[];round.forEach(function(m){advancing=advancing.concat(m.winner)});
      if(advancing.length===2){S.tournament.champion=advancing.join(" / ");}
      else if(advancing.length>=4){S.tournament.rounds.push(genBaraondaRound(advancing));}
    }
    save();render();pushTournament();
  },
  setMatchScore:function(ri,mi,v){S.tournament.rounds[ri][mi].score=v;save();pushTournamentSoon();},
  pickMe:function(n){S.me=n;save();render()},
  changeMe:function(){S.me=null;save();render()},
  pickWinner:function(w){S.winner=w;save();render()},
  lockMatch:function(){
    var b=balanced();
    var teamA=b.teams[0].players.map(function(p){return{nick:p.nick,elo:p.elo}});
    var teamB=b.teams[1].players.map(function(p){return{nick:p.nick,elo:p.elo}});
    var match={id:"local-"+Date.now(),day:S.day,slot:S.slot,court:S.court,stake:S.stake,
      winner:null,playedAt:null,score:"",teams:[{players:teamA},{players:teamB}]};
    S.matches=S.matches.concat([match]);S.stake="";S.pairSeed=0;S.sideSwap={};S.selectedSlot=null;S.screen="home";save();render();
    if(sb)sb.from("matches").insert([{day:match.day,slot:match.slot,court:match.court,stake:match.stake,
      team_a:teamA,team_b:teamB}]).select().then(function(res){
        /* sostituisce l'id provvisorio con quello vero, così "Segna risultato" funziona subito */
        if(res.error||!res.data||!res.data[0])return;
        var realId=res.data[0].id;
        S.matches=S.matches.map(function(m){return m.id===match.id?Object.assign({},m,{id:realId}):m});
        save();render();
      });
  },
  goResultFor:function(id){S.activeMatchId=id;S.winner=null;S.screen="result";save();render();},
  cancelMatch:function(id){
    var match=S.matches.filter(function(m){return m.id==id})[0];
    if(!match)return;
    var ps=match.teams[0].players.concat(match.teams[1].players).map(function(p){return p.nick});
    if(!isAdminUser()&&ps.indexOf(myNick())===-1){
      alert("Questa partita la giocano "+ps.join(", ")+".\n\nTu sei "+(myNick()||"—")+
        ": può cancellarla solo chi ci gioca, oppure l'amministratore (PIN dalla Classifica).");
      return;
    }
    if(!confirm("Cancellare questa partita? Non verrà giocata."))return;
    S.matches=S.matches.filter(function(m){return m.id!==id});save();render();
    if(sb&&String(id).indexOf("local-")!==0)sb.from("matches").delete().eq("id",id).then(function(){});
  },
  /* 1) chi c'era PROPONE il risultato: non muove ancora nessun ELO */
  submitResult:function(){
    if(!S.winner)return;
    var match=S.matches.filter(function(m){return m.id==S.activeMatchId})[0];
    if(!match)return;
    var io=myNick();
    if(!io||matchNicks(match).indexOf(io)===-1){
      if(!isAdminUser()){alert("Solo chi ha giocato questa partita può registrarne il risultato.");return;}
    }
    var score=[S.set1,S.set2,S.set3].map(function(s){return String(s||"").trim()}).filter(Boolean).join(" ");
    var conf={};
    if(io)conf[io]=true; /* il proponente conferma implicitamente */
    var prop={winner:S.winner,score:score,proposed_by:io||"admin",confirmations:conf};
    S.matches=S.matches.map(function(m){return m.id===match.id?
      Object.assign({},m,{winner:prop.winner,score:prop.score,proposedBy:prop.proposed_by,confirmations:conf}):m});
    S.winner=null;S.set1="";S.set2="";S.set3="";S.activeMatchId=null;S.screen="home";save();render();
    if(sb)sb.from("matches").update(prop).eq("id",match.id).then(function(res){
      /* se le colonne della conferma non esistono ancora, si torna al vecchio
         comportamento: risultato applicato subito, senza voto */
      if(res&&res.error)A.applyResult(match.id,prop.winner,prop.score);
    });
  },
  /* 2) gli altri confermano o smentiscono */
  confirmResult:function(id,ok){
    var m=S.matches.filter(function(x){return x.id==id})[0];
    if(!m||!isProposed(m))return;
    var io=myNick();if(!io)return;
    if(!ok){
      if(!confirm("Smentire questo risultato? La proposta viene annullata e la partita torna da giocare."))return;
      S.matches=S.matches.map(function(x){return x.id===m.id?
        Object.assign({},x,{winner:null,score:"",proposedBy:null,confirmations:null}):x});
      save();render();
      if(sb)sb.from("matches").update({winner:null,score:"",proposed_by:null,confirmations:null}).eq("id",m.id).then(function(){});
      return;
    }
    var conf=Object.assign({},m.confirmations||{});conf[io]=true;
    var restano=matchNicks(m).filter(function(n){return conf[n]!==true});
    S.matches=S.matches.map(function(x){return x.id===m.id?Object.assign({},x,{confirmations:conf}):x});
    save();render();
    if(restano.length===0){A.applyResult(m.id,m.winner,m.score);return;}
    if(sb)sb.from("matches").update({confirmations:conf}).eq("id",m.id).then(function(){});
  },
  /* 3) l'amministratore può chiudere senza aspettare tutti */
  forceResult:function(id){
    if(!isAdminUser())return;
    var m=S.matches.filter(function(x){return x.id==id})[0];
    if(!m||!isProposed(m))return;
    if(!confirm("Convalidare il risultato come amministratore, senza attendere le conferme mancanti?"))return;
    A.applyResult(m.id,m.winner,m.score);
  },
  applyResult:function(id,winnerKey,score){
    var match=S.matches.filter(function(m){return m.id==id})[0];
    if(!match)return;
    A._closeMatch(match,winnerKey,score);
  },
  _closeMatch:function(match,winnerKey,score){
    var winIdx=winnerKey==="a"?0:1,loseIdx=1-winIdx;
    var winners=match.teams[winIdx].players.map(function(p){return p.nick});
    var losers=match.teams[loseIdx].players.map(function(p){return p.nick});
    var eloOf=function(nick){var p=S.roster.filter(function(r){return r.nick===nick})[0];return p?p.elo:1500};
    /* ELO vero: quanto vale la vittoria dipende da quanto erano favoriti */
    var swing=eloSwing(avg(winners.map(eloOf)),avg(losers.map(eloOf)));
    score=score||match.score||"";
    var updates=[];
    S.roster=S.roster.map(function(r){
      var rec,nr;
      if(winners.indexOf(r.nick)!==-1){
        rec=parseRecord(r.record);
        nr=Object.assign({},r,{elo:r.elo+swing,delta:"+"+swing,record:(rec.wins+1)+"V · "+rec.losses+"S"});
        updates.push({id:r.id,nick:r.nick,elo:nr.elo,wins:rec.wins+1,losses:rec.losses,last_delta:"+"+swing});
        return nr;
      }
      if(losers.indexOf(r.nick)!==-1){
        rec=parseRecord(r.record);
        nr=Object.assign({},r,{elo:Math.max(0,r.elo-swing),delta:"-"+swing,record:rec.wins+"V · "+(rec.losses+1)+"S"});
        updates.push({id:r.id,nick:r.nick,elo:nr.elo,wins:rec.wins,losses:rec.losses+1,last_delta:"-"+swing});
        return nr;
      }
      return r;
    }).sort(function(a,b){return b.elo-a.elo});
    var stakeText=(match.stake||"").trim();
    if(stakeText)S.penalties=S.penalties.concat([{title:stakeText,who:losers.join(" e "),done:false}]);
    /* la partita non viene più cancellata: diventa storico */
    var playedAt=new Date().toISOString();
    S.matches=S.matches.filter(function(m){return m.id!==match.id});
    S.history=[Object.assign({},match,{winner:winnerKey,playedAt:playedAt,score:score})].concat(S.history);
    S.winner=null;S.set1="";S.set2="";S.set3="";S.activeMatchId=null;S.screen="rank";save();render();
    if(sb){
      updates.forEach(function(u){
        var q=sb.from("players").update({elo:u.elo,wins:u.wins,losses:u.losses,last_delta:u.last_delta});
        (u.id?q.eq("id",u.id):q.eq("nick",u.nick)).then(function(){});
      });
      if(stakeText)sb.from("penalties").insert([{title:stakeText,who:losers.join(" e "),done:false}]).then(function(){});
      /* se la colonna score non esiste ancora, si ripiega su vincitore + data */
      sb.from("matches").update({winner:winnerKey,played_at:playedAt,score:score}).eq("id",match.id).then(function(res){
        if(res&&res.error)sb.from("matches").update({winner:winnerKey,played_at:playedAt}).eq("id",match.id).then(function(){});
      });
    }
  },
  pickStakeChip:function(l){S.stake=l;save();render()},
  togglePenalty:function(i){
    S.penalties[i].done=!S.penalties[i].done;save();render();
    var p=S.penalties[i];
    if(sb&&p.id)sb.from("penalties").update({done:p.done}).eq("id",p.id).then(function(){});
  },
  field:function(k,v){S[k]=v;save()}
};

function todayLabel(){
  var d=new Date();
  var dd=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"][d.getDay()];
  var mm=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto",
    "settembre","ottobre","novembre","dicembre"][d.getMonth()];
  return dd+" "+d.getDate()+" "+mm;
}
function header(){
  var t=(!S.me&&S.screen!=="add")?["Benvenuto","chi sei nella Gabbia?"]:TITLES[S.screen];
  var sub=t[1];
  if(S.me&&S.screen==="home")sub=todayLabel();
  if(S.screen==="tour"&&S.tournament)sub=S.tournament.type==="americano"?"all'americana":S.tournament.type==="baraonda"?"baraonda":"tabellone a eliminazione";
  var m=myPlayer();
  var badge=m?('<div style="display:flex;align-items:center;gap:8px;background:rgba(200,255,61,.1);'+
    'border:1px solid rgba(200,255,61,.3);border-radius:999px;padding:7px 12px;flex-shrink:0">'+
    '<div style="width:8px;height:8px;border-radius:50%;background:#C8FF3D"></div>'+
    '<div style="font-size:13px;font-weight:700">'+m.elo+' ELO</div></div>'):"";
  return '<div style="padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;display:flex;'+
  'align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.09);flex-shrink:0">'+
  '<div><div class="anton" style="font-size:26px;line-height:1">'+esc(t[0])+'</div>'+
  '<div class="kick" style="margin-top:4px">'+esc(sub)+'</div></div>'+badge+'</div>';
}

/* iniziali da mostrare nel quadratino: dal nome vero se c'è, altrimenti dal soprannome */
function initialsOf(nick){
  var p=S.roster.filter(function(r){return r.nick===nick})[0];
  var src=(p&&p.name&&p.name!=="—")?p.name:nick;
  return String(src).trim().split(/\s+/).map(function(w){return w[0]||""}).join("").slice(0,2).toUpperCase();
}
function courtName(i){return (COURTS[i]||["Campo da definire"])[0]}
function dayName(i){return DAYS[i]||"—"}

function slotMinutes(t){var p=String(t).split(":");return (+p[0])*60+(+p[1]||0)}
function book(){
  /* i prossimi 5 giorni veri, a partire da oggi */
  var upcoming=upcomingDays(5);
  if(upcoming.map(function(u){return u.dow}).indexOf(S.day)===-1){S.day=upcoming[0].dow;save()}
  var days=upcoming.map(function(u){var on=S.day===u.dow;
    return '<div class="tapmute" onclick="A.pickDay('+u.dow+')" style="flex:1;text-align:center;border-radius:12px;'+
    'padding:12px 0;background:'+(on?"#C8FF3D":"#141E2A")+';border:1px solid '+(on?"#C8FF3D":"rgba(255,255,255,.12)")+
    ';color:'+(on?"#0B1118":"#FFFFFF")+'">'+
    '<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.7">'+DAYS[u.dow]+'</div>'+
    '<div class="anton" style="font-size:22px;margin-top:3px">'+u.num+'</div></div>'}).join("");
  /* orari occupati: presi dalle partite gia confermate su questo campo */
  var taken={};
  S.matches.forEach(function(m){if(m.day===S.day&&m.court===S.court)taken[m.slot]=true});
  var isToday=upcoming[0].dow===S.day;
  var nowMin=new Date().getHours()*60+new Date().getMinutes();
  var slots=TIMES.map(function(t){
    var busy=!!taken[t],past=isToday&&slotMinutes(t)<=nowMin,free=!busy&&!past;
    var on=S.slot===t&&free;
    var note=busy?"occupato":past?"passato":"libero";
    return '<div '+(free?'class="tapmute" onclick="A.pickSlot(\''+t+'\')"':'')+
    ' style="border-radius:12px;padding:14px 0;text-align:center;background:'+
    (!free?"#10161F":on?"rgba(200,255,61,.16)":"#141E2A")+';border:1px solid '+
    (on?"#C8FF3D":"rgba(255,255,255,.1)")+';color:'+(!free?"#5A6B7D":"#FFFFFF")+'">'+
    '<div style="font-size:16px;font-weight:700">'+t+'</div>'+
    '<div style="font-size:10px;opacity:.7;margin-top:2px">'+note+'</div></div>'}).join("");
  var courts=COURTS.map(function(c,i){var on=S.court===i;
    return '<div class="tapmute" onclick="A.pickCourt('+i+')" style="display:flex;align-items:center;gap:12px;'+
    'border-radius:12px;padding:14px;background:'+(on?"rgba(200,255,61,.09)":"#141E2A")+
    ';border:1px solid '+(on?"rgba(200,255,61,.5)":"rgba(255,255,255,.1)")+'">'+
    '<div style="width:10px;height:10px;border-radius:50%;background:'+c[3]+'"></div>'+
    '<div style="flex:1"><div style="font-size:15px;font-weight:700">'+esc(c[0])+'</div>'+
    '<div style="font-size:11px;color:#8C99A8">'+esc(c[1])+'</div></div>'+
    '<div style="font-size:14px;font-weight:700;color:#C8FF3D">'+c[2]+'</div></div>'}).join("");
  return '<div class="pad" style="gap:20px">'+
  '<div><div class="kick" style="margin-bottom:10px">Giorno</div><div style="display:flex;gap:8px">'+days+'</div></div>'+
  '<div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px">'+
  '<div class="kick">Orari</div><div style="font-size:11px;color:#8C99A8">'+
  (Object.keys(taken).length?Object.keys(taken).length+" già prenotati dalla Gabbia":"nessuno ancora occupato")+'</div></div>'+
  '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+slots+'</div></div>'+
  '<div><div class="kick" style="margin-bottom:10px">Campo</div>'+
  '<div style="display:flex;flex-direction:column;gap:8px">'+courts+'</div></div>'+
  '<a href="'+CLUBS[COURTS[S.court][4]].url+'" target="_blank" style="display:flex;align-items:center;justify-content:center;gap:8px;'+
  'text-decoration:none;background:#141E2A;border:1px solid rgba(200,255,61,.3);border-radius:14px;padding:15px;'+
  'color:#C8FF3D;font-weight:700;font-size:14px">Apri app '+CLUBS[COURTS[S.court][4]].name+' per prenotare davvero ↗</a>'+
  '<div class="tapmute" onclick="A.confirm()" style="background:#C8FF3D;color:#0B1118;border-radius:14px;padding:17px;'+
  'text-align:center;font-weight:700;font-size:16px">Conferma '+dayName(S.day)+' '+esc(S.slot)+' · '+esc(courtName(S.court))+'</div>'+
  '<div style="font-size:11px;color:#8C99A8;text-align:center;line-height:1.5">Questa conferma è solo per organizzarvi nel gruppo — la prenotazione vera del campo va fatta sull\'app del circolo. '+
  'Chi non risponde entro due ore gioca in difesa.</div></div>';
}

/* vittorie consecutive più recenti, lette dallo storico (dal più recente in giù) */
function winStreak(nick){
  var s=0;
  for(var i=0;i<S.history.length;i++){
    var m=S.history[i],wi=m.winner==="b"?1:0;
    var won=m.teams[wi].players.some(function(p){return p.nick===nick});
    var lost=m.teams[1-wi].players.some(function(p){return p.nick===nick});
    if(!won&&!lost)continue;
    if(!won)break;
    s++;
  }
  return s;
}
/* premi calcolati sui dati veri: niente bacheca uguale per tutti */
function awardsFor(p,rankPos){
  var rec=parseRecord(p.record),games=rec.wins+rec.losses,out=[];
  if(rankPos===1)out.push(["1","In vetta alla Gabbia",(p.gender==="F"?"Queen":"King")+" of the Padel"]);
  else if(rankPos>0&&rankPos<=3)out.push(["3","Sul podio",rankPos+"º posto in classifica"]);
  var st=winStreak(p.nick);
  if(st>=2)out.push(["▲","Serie aperta",st+" vittorie di fila"]);
  if(games>=10)out.push(["V","Veterano",games+" partite giocate"]);
  if(games>=5&&rec.wins/games>=0.6)out.push(["%","Cecchino",Math.round(rec.wins/games*100)+"% di vittorie"]);
  if(rec.wins>=1&&games<5)out.push(["✓","Sbloccato","prima vittoria in Gabbia"]);
  return out;
}

/* ---------- Statistiche giocatore ----------
   Tutto si ricava dallo storico: team_a/team_b conservano l'ELO di ciascuno
   al momento in cui la partita è stata bloccata, quindi la curva dell'ELO
   esce gratis senza colonne aggiuntive. */
function slotBand(slot){
  var h=Math.floor(slotMinutes(slot)/60);
  return h<19?"Pomeriggio":h<21?"Sera":"Tarda sera";
}
function bump(map,key,won){var e=map[key]||(map[key]={w:0,l:0});if(won)e.w++;else e.l++}
function statsFor(nick){
  var played=S.history.slice().reverse(); /* dal più vecchio al più recente */
  var series=[],wins=0,losses=0,partners={},rivals={},clubs={},bands={};
  played.forEach(function(m){
    var myTeam=-1;
    [0,1].forEach(function(t){if(m.teams[t].players.some(function(p){return p.nick===nick}))myTeam=t});
    if(myTeam===-1)return;
    var mine=m.teams[myTeam].players.filter(function(p){return p.nick===nick})[0];
    if(mine&&typeof mine.elo==="number")series.push(mine.elo);
    var won=myTeam===(m.winner==="b"?1:0);
    if(won)wins++;else losses++;
    m.teams[myTeam].players.forEach(function(p){if(p.nick!==nick)bump(partners,p.nick,won)});
    m.teams[1-myTeam].players.forEach(function(p){bump(rivals,p.nick,won)});
    bump(clubs,(COURTS[m.court]||[])[4]||"?",won);
    bump(bands,slotBand(m.slot),won);
  });
  var cur=(S.roster.filter(function(r){return r.nick===nick})[0]||{}).elo;
  if(typeof cur==="number")series.push(cur);
  return{series:series,wins:wins,losses:losses,games:wins+losses,
    partners:partners,rivals:rivals,clubs:clubs,bands:bands};
}
function pct(w,l){var g=w+l;return g?Math.round(w/g*100):0}
/* miglior compagno: percentuale di vittorie, a parità vince chi ha giocato di più */
function bestOf(map,by){
  var keys=Object.keys(map);if(!keys.length)return null;
  keys.sort(function(a,b){
    var A=map[a],B=map[b];
    if(by==="rivale")return (B.l-B.w)-(A.l-A.w)||B.l-A.l;
    return pct(B.w,B.l)-pct(A.w,A.l)||(B.w+B.l)-(A.w+A.l);
  });
  return{nick:keys[0],rec:map[keys[0]]};
}
function sparkline(vals){
  if(vals.length<2)return "";
  var W=300,H=80,pad=8;
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),span=(max-min)||1;
  var pts=vals.map(function(v,i){
    var x=pad+i*(W-pad*2)/(vals.length-1);
    var y=H-pad-((v-min)/span)*(H-pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  });
  var last=pts[pts.length-1].split(",");
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:80px;display:block" fill="none">'+
    '<polyline points="'+pts.join(" ")+'" stroke="#C8FF3D" stroke-width="2" '+
    'vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="3.5" fill="#C8FF3D"/></svg>';
}
/* riga con barra: usata per circoli e fasce orarie */
function barRow(label,rec){
  var p=pct(rec.w,rec.l);
  return '<div style="background:#141E2A;border:0.5px solid #26313F;border-radius:12px;padding:13px">'+
  '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">'+
  '<div style="font-size:15px;font-weight:600;color:#FFFFFF">'+esc(label)+'</div>'+
  '<div style="font-size:13px;color:#8C99A8">'+rec.w+'V · '+rec.l+'S · '+p+'%</div></div>'+
  '<div style="height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden">'+
  '<div style="height:100%;width:'+p+'%;background:#C8FF3D"></div></div></div>';
}
function highlightRow(glyph,title,sub){
  return '<div style="display:flex;gap:12px;align-items:center;background:#141E2A;'+
  'border:0.5px solid #26313F;border-radius:12px;padding:13px">'+

function fmtTime(ms){var s=Math.max(0,Math.ceil(ms/1000));var m=Math.floor(s/60),sec=s%60;return m+":"+(sec<10?"0":"")+sec}
function checkMatchTimer(m){
  if(!m.timerRunning)return;
  if(m.timerEndsAt-Date.now()<=0&&!m.timerDone){A.beep();m.timerRunning=false;m.timerDone=true;save();}
}
function scoreInput(ri,mi,val){
  return '<input value="'+esc(val||"")+'" oninput="A.setMatchScore('+ri+','+mi+',this.value)" placeholder="punteggio, es. 6-3 6-4" '+
  'style="width:100%;background:#141E2A;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:9px 11px;'+
  'color:#FFFFFF;font-size:12px;margin-top:-2px">';
}
function genBaraondaRound(players){
  var shuffled=players.slice();
  for(var i=shuffled.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=t;}
  var matches=[];
  for(var k=0;k+4<=shuffled.length;k+=4)matches.push({a:[shuffled[k],shuffled[k+1]],b:[shuffled[k+2],shuffled[k+3]],winner:null});
  return matches;
}
function bracketHtml(rounds){
  var COL_W=178,COL_GAP=40;
  var numRounds=rounds.length;
  function roundLabel(r){var rem=numRounds-1-r;return rem===0?"Finale":rem===1?"Semifinale":rem===2?"Quarti":"Turno "+(r+1);}
  function card(ri,mi,m){
    var canPick=!!m.a&&!!m.b&&!m.winner;
    function sameTeam(t1,t2){return t1&&t2&&t1.join(",")===t2.join(",")}
    var aWin=sameTeam(m.winner,m.a),bWin=sameTeam(m.winner,m.b);
    function row(team,isWin){
      if(!team)return '<div style="display:flex;align-items:center;gap:9px;padding:10px 11px;opacity:.4">'+
        '<div style="width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08);flex-shrink:0"></div>'+
        '<div style="font-size:11px;color:#8C99A8">BYE</div></div>';
      var initials=((team[0]||"")[0]||"")+((team[1]||"")[0]||"");
      var clk=canPick?'class="tapmute" onclick="A.pickTourWinner('+ri+','+mi+',JSON.parse(this.dataset.team))" data-team=\''+attrJson(team)+'\'':'';
      return '<div '+clk+' style="display:flex;align-items:center;gap:9px;padding:10px 11px;'+
      (isWin?"background:rgba(200,255,61,.12)":"")+'">'+
      '<div style="width:24px;height:24px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:9px;font-weight:800;'+
      (isWin?"background:#C8FF3D;color:#0B1118":"background:rgba(255,255,255,.09);color:#8C99A8")+'">'+esc(initials.toUpperCase())+'</div>'+
      '<div style="flex:1;font-size:12px;font-weight:700;line-height:1.25;'+(isWin?"":"color:#8C99A8")+'">'+esc(team.join(" / "))+'</div>'+
      (isWin?'<div style="color:#C8FF3D;font-size:12px;font-weight:800;flex-shrink:0">\u2713</div>':'')+'</div>';
    }
    var extra=(m.winner?scoreInput(ri,mi,m.score):"")+timerHtml(m,"A.startMatchTimer(S.tournament.rounds["+ri+"]["+mi+"])");
    return '<div class="bkt-card" data-r="'+ri+'" data-m="'+mi+'" data-decided="'+(m.winner?1:0)+'" '+
    'style="background:#141E2A;border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden">'+
    row(m.a,aWin)+'<div style="height:1px;background:rgba(255,255,255,.08)"></div>'+row(m.b,bWin)+
    (extra?'<div style="padding:8px 10px 10px">'+extra+'</div>':'')+'</div>';
  }
  var cols=rounds.map(function(round,ri){
    var matches=round.map(function(m,mi){return card(ri,mi,m)}).join("");
    return '<div class="bkt-col" style="display:flex;flex-direction:column;justify-content:center;gap:16px;width:'+COL_W+'px;'+
    'flex-shrink:0;margin-right:'+(ri<numRounds-1?COL_GAP:0)+'px">'+matches+'</div>';
  }).join("");
  var labels=rounds.map(function(round,ri){
    return '<div style="width:'+COL_W+'px;flex-shrink:0;text-align:center;margin-right:'+(ri<numRounds-1?COL_GAP:0)+'px">'+
    '<div class="kick" style="color:'+(ri===numRounds-1?"#C8FF3D":"#8C99A8")+'">'+roundLabel(ri)+'</div></div>';
  }).join("");
  return '<div class="bkt-scroll"><div style="width:max-content">'+
  '<div style="display:flex">'+labels+'</div>'+
  '<div class="bkt-wrap" style="position:relative;margin-top:10px">'+
  '<svg class="bkt-svg" style="position:absolute;left:0;top:0;pointer-events:none"></svg>'+
  '<div style="display:flex;position:relative;z-index:2">'+cols+'</div></div></div></div>';
}
function drawBracketLines(){
  var wrap=document.querySelector(".bkt-wrap");if(!wrap)return;
  var svg=wrap.querySelector(".bkt-svg");
  var cols=Array.prototype.slice.call(wrap.querySelectorAll(".bkt-col"));
  var wr=wrap.getBoundingClientRect();
  svg.setAttribute("width",wrap.scrollWidth);svg.setAttribute("height",wrap.scrollHeight);
  var lines=[];var NEUTRAL="rgba(255,255,255,.16)",LIME="#C8FF3D";
  for(var r=0;r<cols.length-1;r++){
    var cards=Array.prototype.slice.call(cols[r].querySelectorAll(".bkt-card"));
    var nextCards=Array.prototype.slice.call(cols[r+1].querySelectorAll(".bkt-card"));
    var colR=cards[0].closest(".bkt-col").getBoundingClientRect();
    var colL=nextCards[0].closest(".bkt-col").getBoundingClientRect();
    for(var j=0;j<nextCards.length;j++){
      var c0=cards[2*j],c1=cards[2*j+1];
      var r0=c0.getBoundingClientRect(),r1=c1.getBoundingClientRect();
      var y0=r0.top+r0.height/2-wr.top,y1=r1.top+r1.height/2-wr.top,yMid=(y0+y1)/2;
      var xR=colR.right-wr.left,xMid=xR+(colL.left-colR.right)/2,xL=colL.left-wr.left;
      var d0=c0.dataset.decided==="1"?LIME:NEUTRAL,d1=c1.dataset.decided==="1"?LIME:NEUTRAL;
      var df=(c0.dataset.decided==="1"&&c1.dataset.decided==="1")?LIME:NEUTRAL;
      lines.push('<line x1="'+xR+'" y1="'+y0+'" x2="'+xMid+'" y2="'+y0+'" stroke="'+d0+'" stroke-width="2"/>');
      lines.push('<line x1="'+xR+'" y1="'+y1+'" x2="'+xMid+'" y2="'+y1+'" stroke="'+d1+'" stroke-width="2"/>');
      lines.push('<line x1="'+xMid+'" y1="'+y0+'" x2="'+xMid+'" y2="'+yMid+'" stroke="'+d0+'" stroke-width="2"/>');
      lines.push('<line x1="'+xMid+'" y1="'+yMid+'" x2="'+xMid+'" y2="'+y1+'" stroke="'+d1+'" stroke-width="2"/>');
      lines.push('<line x1="'+xMid+'" y1="'+yMid+'" x2="'+xL+'" y2="'+yMid+'" stroke="'+df+'" stroke-width="2"/>');
    }
  }
  svg.innerHTML=lines.join("");
}
function timerHtml(m,onStart){
  if(!S.tournament||!S.tournament.duration)return "";
  if(m.winner)return "";
  checkMatchTimer(m);
  var big=m.timerRunning||m.timerDone||m.timerPaused;
  var label=m.timerRunning?fmtTime(m.timerEndsAt-Date.now()):m.timerPaused?fmtTime(m.timerRemainingMs)+" · in pausa":m.timerDone?"TEMPO!":"⏱ Avvia cronometro";
  var color=m.timerDone?"#FF6A35":"#FFFFFF";

var TB=(function(){
  var ICONS={
    home:'<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
    book:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
    pairs:'<circle cx="8" cy="9" r="3.2"/><circle cx="16.5" cy="9" r="3.2"/><path d="M2.5 20c.6-3 2.8-4.6 5.5-4.6S13 17 13.6 20M11.5 20c.5-2.8 2.6-4.6 5-4.6s4.4 1.7 5 4.6"/>',
    rank:'<path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/>',
    tour:'<path d="M3 5h5v6H3zM3 15h5v5H3zM16 8h5v8h-5zM8 8h4v4H8zM8 17h4v-5"/>',
    me:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-4 3.9-6 7.5-6s6.7 2 7.5 6"/>'
  };
  var TABS=[["home","Gabbia"],["book","Prenota"],["pairs","Coppie"],["rank","Classifica"],["tour","Torneo"],["me","Io"]];
  var el,svg,path,bubble,items=[],idx=0,cx=0,target=0,vel=0,raf=0,H=76,BW=52;

  function icon(k,color){
    return '<svg class="tb-ico" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+ICONS[k]+'</svg>';
  }
  function shape(W,c){
    var r=38,d=26,ya=3,dip=30;
    var l=Math.max(0,c-r-d),rr=Math.min(W,c+r+d);
    return 'M0,0 L'+l.toFixed(1)+',0'
      +' C'+(l+d*0.55).toFixed(1)+',0 '+(c-r-2).toFixed(1)+','+ya+' '+(c-r).toFixed(1)+','+ya
      +' C'+(c-r*0.45).toFixed(1)+','+ya+' '+(c-r*0.58).toFixed(1)+','+dip+' '+c.toFixed(1)+','+dip
      +' C'+(c+r*0.58).toFixed(1)+','+dip+' '+(c+r*0.45).toFixed(1)+','+ya+' '+(c+r).toFixed(1)+','+ya
      +' C'+(c+r+2).toFixed(1)+','+ya+' '+(rr-d*0.55).toFixed(1)+',0 '+rr.toFixed(1)+',0'
      +' L'+W+',0 L'+W+','+H+' L0,'+H+' Z';
  }
  function paint(){
    var W=el.clientWidth||390;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    path.setAttribute('d',shape(W,cx));
    bubble.style.left=(cx-BW/2)+'px';
    bubble.style.top='2px';
  }
  function centerOf(i){
    var it=items[i]; if(!it) return 0;
    return it.offsetLeft+it.offsetWidth/2;
  }
  function tick(){
    var k=210,damp=26,dt=1/60;
    var a=k*(target-cx)-damp*vel;
    vel+=a*dt; cx+=vel*dt;
    paint();
    if(Math.abs(target-cx)<0.3&&Math.abs(vel)<0.5){cx=target;vel=0;paint();raf=0;return}
    raf=requestAnimationFrame(tick);
  }
  function select(i,instant){
    if(i<0)i=0;
    idx=i;
    items.forEach(function(it,n){it.classList.toggle('on',n===i)});
    bubble.innerHTML=icon(TABS[i][0],'#0B1118');
    bubble.firstChild.style.opacity='1';
    target=centerOf(i);
    if(instant||!cx){cx=target;vel=0;if(raf){cancelAnimationFrame(raf);raf=0}paint();return}
    if(!raf)raf=requestAnimationFrame(tick);
  }
  function init(){
    el=document.getElementById('tabbar');
    el.style.height='calc('+H+'px + env(safe-area-inset-bottom))';
    el.innerHTML='<svg class="tb-shape" preserveAspectRatio="none" viewBox="0 0 390 '+H+'">'+
      '<path fill="#141E2A" stroke="#26313F" stroke-width="0.5"></path></svg>'+
      '<div class="tb-items">'+TABS.map(function(t){
        return '<div class="tb-item" data-k="'+t[0]+'">'+icon(t[0],'#8C99A8')+'<div class="tb-lbl">'+t[1]+'</div></div>'
      }).join('')+'</div><div class="tb-bubble"></div>';
    svg=el.querySelector('svg');path=svg.querySelector('path');bubble=el.querySelector('.tb-bubble');
    var W=el.clientWidth||390;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    items=Array.prototype.slice.call(el.querySelectorAll('.tb-item'));
    items.forEach(function(it){it.addEventListener('click',function(){A.nav(it.getAttribute('data-k'))})});
    window.addEventListener('resize',function(){
      var w=el.clientWidth||390;svg.setAttribute('viewBox','0 0 '+w+' '+H);target=centerOf(idx);cx=target;paint();
    });
    select(0,true);
  }
  return {init:init,select:select};
})();

function tabIndex(){
  var s=S.screen;
  if(s==="add"||s==="result"||s==="admedit")return 3;
  if(s==="editme"||s==="stats")return 5;
  return Math.max(0,["home","book","pairs","rank","tour","me"].indexOf(s));
}

function render(){
  var view=document.getElementById("view"),bar=document.getElementById("tabbar");
  /* se l'identità salvata non corrisponde più a nessuno nel roster (soprannome
     cambiato, giocatore eliminato) si tornerebbe "fantasmi": si vede tutto ma non
     si può cancellare né modificare niente. Meglio richiedere chi sei. */
  if(S.me&&S.roster.length&&!myPlayer()){S.me=null;save();}
  if(!S.me){
    bar.style.display="none";
    view.innerHTML=header()+'<div class="scroll">'+(S.screen==="add"?addScreen():mePicker())+'</div>';
    return;
  }
  bar.style.display="block";
  var body={home:home,book:book,pairs:pairs,rank:rank,add:addScreen,me:me,editme:editProfileScreen,result:resultScreen,tour:tour,stats:statsScreen,admedit:adminEditScreen}[S.screen]||home;
  view.innerHTML=header()+'<div class="scroll">'+body()+'</div>';
  if(!tabsReady){TB.init();tabsReady=true;TB.select(tabIndex(),true);}
  else TB.select(tabIndex());
  if(S.screen==="tour"&&S.tournament&&S.tournament.type==="elim")requestAnimationFrame(drawBracketLines);
}
render();
initSync();
</script>
</body>
</html>
