  if(!code||String(code).length!==2)return "";

}

/* Chi ha vinto: si ricava dal tabellone, senza colonne aggiuntive.
   Per eliminazione, gironi e baraonda è il vincitore dell'ultima partita rimasta;
   per l'americana è chi guida la classifica, ma solo a torneo completo. */
function campioneDi(t){
  var rounds=t.rounds||[];
  if(!rounds.length)return null;
  if(t.type==="americano"){
    var completo=rounds.every(function(r){return (r||[]).every(function(m){return m&&m.winner})});
    if(!completo)return null;
    var pts={};
    rounds.forEach(function(round){round.forEach(function(m){
      var w=m.winner==="a"?m.a:m.winner==="b"?m.b:null;
      var l=m.winner==="a"?m.b:m.winner==="b"?m.a:null;
      if(w)w.forEach(function(n){pts[n]=(pts[n]||0)+1});
      if(l)l.forEach(function(n){pts[n]=pts[n]||0});
    })});
    var ord=Object.keys(pts).sort(function(a,b){return pts[b]-pts[a]});
    return ord.length?ord[0]:null;
  }
  /* il torneo è finito solo se l'ultimo turno è arrivato a UNA sola partita — la
     finale — e quella ha un esito. Con più partite nell'ultimo turno si sta ancora
     giocando: prendere il vincitore della prima darebbe un campione inventato. */
  var ultimo=rounds[rounds.length-1];
  if(ultimo&&ultimo.length===1&&ultimo[0]&&ultimo[0].winner)return ultimo[0].winner.join(" / ");
  return null;
}
/* Pulizia: si conserva ciò che ha un vincitore, il resto se ne va.
   Restano quindi solo i tornei arrivati in fondo — quelli dell'albo d'oro. Spariscono
   sia quelli creati e mai iniziati, sia quelli lasciati a metà: entrambi, "alla fine,
   non si sono svolti". I tornei in corso (`active`) non vengono mai toccati, e la
   finestra di 24 ore protegge quelli appena chiusi. */
function pulisciTorneiChiusi(rows){
  if(!sb||!rows)return;
  var limite=Date.now()-24*3600000;
  var vecchi=rows.filter(function(r){
    return r.status!=="active"
      &&new Date(r.created_at).getTime()<limite
      &&!campioneDi(r);
  }).map(function(r){return r.id});
  if(!vecchi.length)return;
  sb.from("tournaments").delete().in("id",vecchi).then(function(){});
}

   chi ha vinto QUELLA partita (non necessariamente quel set): "7-5 1-6"
   significa che il vincitore dichiarato ha preso il primo set 7-5 e perso il
   secondo 1-6 — un set a testa, nessun vincitore vero. Se non ci sono
   punteggi scritti (il campo è opzionale) non c'è nulla da controllare. */
function punteggioContraddiceVincitore(scoreStr){
  var sets=String(scoreStr||"").trim().split(/\s+/).filter(Boolean);
  if(!sets.length)return false;
  var vinti=0,persi=0;
  sets.forEach(function(s){
    var m=s.match(/^(\d+)-(\d+)$/);
    if(!m)return;
    var a=+m[1],b=+m[2];
    if(a>b)vinti++;else if(b>a)persi++;
  });
  if(vinti+persi===0)return false; /* niente di leggibile: non blocchiamo */
  return vinti<=persi;
}
/* squadra (0 o 1) a cui appartiene un nick in questa partita, -1 se non c'è */
function squadraDi(m,nick){
  for(var t=0;t<2;t++)if(m.teams[t].players.some(function(p){return p.nick===nick}))return t;
  return -1;
}
/* la squadra avversaria di chi ha proposto: solo loro possono confermare, un
   compagno di squadra del proponente direbbe sempre di sì e non verifica niente.
   Se il proponente non si riconosce (es. admin che propone per altri) il vincolo
   non si applica: chiunque dei quattro può confermare, come prima. */
function squadraAvversariaProponente(m){
  var t=squadraDi(m,m.proposedBy);
  return t===-1?null:1-t;
}
function possoConfermare(m,nick){
  var avv=squadraAvversariaProponente(m);
  if(avv===null||squadraDi(m,nick)===avv)return true;
  /* l'amministratore può confermare come arbitro neutrale — ma non un
     risultato che ha proposto lui stesso o il suo compagno di squadra:
     su quello resta valida solo la conferma di un vero avversario */
  return isAdminUser()&&squadraDi(m,nick)!==squadraDi(m,m.proposedBy);
}
/* chi manca perché il risultato si chiuda: solo gli avversari del proponente
   che non hanno ancora confermato — non i suoi compagni di squadra */
function avversariMancanti(m){
  var avv=squadraAvversariaProponente(m);
  if(avv===null)return pendingVoters(m);
  var conf=m.confirmations||{};
  return m.teams[avv].players.map(function(p){return p.nick}).filter(function(n){return conf[n]!==true});
}
/* tocca a me votare? (vale per tutti e quattro: anche un compagno di squadra
   può smentire un punteggio sbagliato, solo non può confermarlo lui).
   L'amministratore vota anche se non gioca questa partita: fa da arbitro
   neutrale invece di dover per forza convalidare "al buio" senza conferme. */
function needsMyVote(m){
  if(!isProposed(m))return false;
  var n=myNick();
  if(n&&matchNicks(m).indexOf(n)!==-1)return (m.confirmations||{})[n]!==true;
  if(isAdminUser())return (m.confirmations||{})[n||"admin"]!==true;
  return false;
}
/* ---- rinomina di un soprannome, ovunque compaia ----
   il nick non è solo un'etichetta: è la chiave dentro matches.team_a/team_b,
   matches.confirmations, penalties.who e tournaments.rounds. Cambiarlo solo su
   players scollegherebbe tutto lo storico, quindi si riscrive dappertutto. */
function renameInMatch(m,vecchio,nuovo){
  var ren=function(n){return n===vecchio?nuovo:n};
  var teams=[0,1].map(function(i){
    return{players:m.teams[i].players.map(function(p){return Object.assign({},p,{nick:ren(p.nick)})})}});
  var conf=null;
  if(m.confirmations){conf={};Object.keys(m.confirmations).forEach(function(k){conf[ren(k)]=m.confirmations[k]})}
  return Object.assign({},m,{teams:teams,confirmations:m.confirmations?conf:m.confirmations,
    proposedBy:m.proposedBy?ren(m.proposedBy):m.proposedBy});
}
function matchHasNick(m,nick){return matchNicks(m).indexOf(nick)!==-1}
function renameInRounds(rounds,vecchio,nuovo){
  var ren=function(n){return n===vecchio?nuovo:n};
  return (rounds||[]).map(function(round){
    return round.map(function(g){
      var conv=function(t){return Array.isArray(t)?t.map(ren):t};
      return Object.assign({},g,{a:conv(g.a),b:conv(g.b),
        winner:Array.isArray(g.winner)?g.winner.map(ren):g.winner});
    });
  });
}
function renameEverywhere(vecchio,nuovo){
  var ren=function(n){return n===vecchio?nuovo:n};
  var toccate=S.matches.filter(function(m){return matchHasNick(m,vecchio)})
    .concat(S.history.filter(function(m){return matchHasNick(m,vecchio)}));
  S.matches=S.matches.map(function(m){return matchHasNick(m,vecchio)?renameInMatch(m,vecchio,nuovo):m});
  S.history=S.history.map(function(m){return matchHasNick(m,vecchio)?renameInMatch(m,vecchio,nuovo):m});
  var penToccate=[];
  S.penalties=S.penalties.map(function(p){
    if(String(p.who||"").indexOf(vecchio)===-1)return p;
    var np=Object.assign({},p,{who:String(p.who).split(vecchio).join(nuovo)});
    penToccate.push(np);return np;
  });
  if(S.tournament&&S.tournament.rounds){
    S.tournament=Object.assign({},S.tournament,{rounds:renameInRounds(S.tournament.rounds,vecchio,nuovo)});
    if(S.tournament.champion)S.tournament.champion=String(S.tournament.champion).split(vecchio).join(nuovo);
  }
  S.lineup=(S.lineup||[]).map(ren);
  S.tourTeams=(S.tourTeams||[]).map(function(t){return t.map(ren)});
  if(S.tourPick)S.tourPick=ren(S.tourPick);
  if(S.tourSelected&&S.tourSelected[vecchio]){
    S.tourSelected[nuovo]=S.tourSelected[vecchio];delete S.tourSelected[vecchio];
  }
  if(S.me===vecchio)S.me=nuovo; /* identità ancora legata al nick, nei salvataggi vecchi */
  if(!sb)return;
  /* server: una riga alla volta, i volumi sono piccoli */
  S.matches.concat(S.history).forEach(function(m){
    if(!matchHasNick(m,nuovo))return;
    if(!toccate.some(function(t){return t.id===m.id}))return;
    if(String(m.id).indexOf("local-")===0)return;
    var payload={team_a:m.teams[0].players,team_b:m.teams[1].players};
    var esteso=Object.assign({},payload,{proposed_by:m.proposedBy||null,confirmations:m.confirmations||null});
    sb.from("matches").update(esteso).eq("id",m.id).then(function(res){
      if(res&&res.error)sb.from("matches").update(payload).eq("id",m.id).then(function(){});
    });
  });
  penToccate.forEach(function(p){
    if(p.id)sb.from("penalties").update({who:p.who}).eq("id",p.id).then(function(){});
  });
  if(S.tournament&&S.tournament.id)
    sb.from("tournaments").update({rounds:S.tournament.rounds}).eq("id",S.tournament.id).then(function(){});
}
/* due partite della stessa durata si sovrappongono se i loro orari di inizio distano
   meno della durata stessa — vale in entrambe le direzioni: una partita delle 18:00
   confligge tanto con una nuova delle 18:30 quanto con una delle 17:00 (che
   arriverebbe fino alle 18:30). */
function siSovrappongono(slotA,slotB){
  return Math.abs(slotMinutes(slotA)-slotMinutes(slotB))<MATCH_DURATION_MIN;
}
/* chi è già impegnato in una partita che si sovrappone a quei 90 minuti — non solo
   chi ha una partita che inizia esattamente in quell'orario. */
function busyNicks(day,slot){
  var out={};
  S.matches.forEach(function(m){
    if(m.day!==day||!siSovrappongono(slot,m.slot))return;
    m.teams[0].players.concat(m.teams[1].players).forEach(function(p){out[p.nick]=true});
  });
  return out;
}
function balanced(){
  var swap=S.sideSwap||{};
  var pool=lineupPlayers();
  var combos=[[0,1,2,3],[0,2,1,3],[0,3,1,2]];
  var sc=combos.map(function(c){var a=pool[c[0]].elo+pool[c[1]].elo,b=pool[c[2]].elo+pool[c[3]].elo;
    return{c:c,diff:Math.abs(a-b),a:a,b:b}}).sort(function(x,y){return x.diff-y.diff});
  /* L'accoppiamento scelto resta FISSO finché non premi "Rimescola". Prima veniva
     ricalcolato a ogni modifica: sostituendo un giocatore, gli altri due si scambiavano
     di posto da soli e sembrava che l'app avesse cambiato la persona sbagliata. */
  var p=null;
  if(S.pairCombo&&S.pairCombo.length===4)
    p=sc.filter(function(x){return x.c.join(",")===S.pairCombo.join(",")})[0];
  if(!p){p=sc[S.pairSeed%sc.length];S.pairCombo=p.c.slice();save()}
  /* i riquadri a schermo NON sono nell'ordine di S.lineup: le coppie nascono da una
     permutazione (es. [0,2,1,3]) e i lati si possono invertire. Insieme ai giocatori
     si restituisce quindi anche l'indice che ciascuno occupa in S.lineup: senza,
     la sostituzione dalla panchina finiva sul giocatore sbagliato. */
  var i0=swap[0]?[p.c[1],p.c[0]]:[p.c[0],p.c[1]];
  var i1=swap[1]?[p.c[3],p.c[2]]:[p.c[2],p.c[3]];
  var t0=i0.map(function(k){return pool[k]});
  var t1=i1.map(function(k){return pool[k]});
  return{diff:p.diff,teams:[{players:t0,idx:i0,sum:p.a},{players:t1,idx:i1,sum:p.b}]};
}

  startMatchTimer:function(m){
    /* la durata è quella del torneo in corso, non l'ultima scelta nel form */
    var dur=S.tournament&&S.tournament.duration;
    if(!dur)return;
    if(m.timerRunning){
      m.timerRemainingMs=m.timerEndsAt-Date.now();m.timerRunning=false;m.timerPaused=true;
    }else if(m.timerPaused){
      m.timerEndsAt=Date.now()+m.timerRemainingMs;m.timerRunning=true;m.timerPaused=false;
    }else{
      m.timerEndsAt=Date.now()+dur*60000;m.timerRunning=true;m.timerPaused=false;m.timerDone=false;
    }
    save();render();pushTournament();
  },
  beep:function(){
    try{
      var ctx=new (window.AudioContext||window.webkitAudioContext)();
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880;g.gain.value=0.2;
      o.start();setTimeout(function(){o.stop();ctx.close()},700);
    }catch(e){}
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
  },
  createTournament:function(){
    var selectedNicks=Object.keys(S.tourSelected).filter(function(n){return S.tourSelected[n]});
    if(S.tourType==="elim"){
      /* "Scarsi e scarsoni" forma le coppie da sé fra i selezionati;
         "Bilanciate" usa quelle che hai composto a mano */
      var teams=S.tourPairMode==="weak"?
        A.formTeams(S.tourGender,"weak",0,selectedNicks):
        S.tourTeams.filter(function(t){return selectedNicks.indexOf(t[0])!==-1&&selectedNicks.indexOf(t[1])!==-1});
      if(teams.length<2)return;
      var count=1;while(count*2<=teams.length)count*=2;
      var usable=teams.slice(0,count);
      var round0=[];
      for(var i=0;i<usable.length;i+=2)round0.push({a:usable[i],b:usable[i+1]||null,winner:null});
      var rounds=[round0],c=round0.length;
      while(c>1){c=c/2;var rr=[];for(var j=0;j<c;j++)rr.push({a:null,b:null,winner:null});rounds.push(rr);}
      startTournament({type:"elim",rounds:rounds,courts:S.tourCourts,duration:S.tourDuration});
      return;
    }
    if(S.tourType==="gironi"){
      var teamsG=S.tourPairMode==="weak"?
        A.formTeams(S.tourGender,"weak",0,selectedNicks):
        S.tourTeams.filter(function(t){return selectedNicks.indexOf(t[0])!==-1&&selectedNicks.indexOf(t[1])!==-1});
      if(teamsG.length<2)return;
      var eloDi=function(n){var p=S.roster.filter(function(r){return r.nick===n})[0];return p?p.elo:1500};
      teamsG=teamsG.slice().sort(function(x,y){return (eloDi(y[0])+eloDi(y[1]))-(eloDi(x[0])+eloDi(x[1]))});
      /* ogni girone deve avere almeno due coppie, altrimenti non si gioca niente */
      var nG=Math.max(1,Math.min(S.tourGironi||2,Math.floor(teamsG.length/2)));
      startTournament({type:"gironi",rounds:[genGironi(teamsG,nG)],
        courts:S.tourCourts,duration:S.tourDuration});
      return;
    }
    if(S.tourType==="americano"){
      var pool=A.filterPool(S.tourGender==="mixed"?"all":S.tourGender).filter(function(p){return selectedNicks.indexOf(p.nick)!==-1});
      var n=pool.length;n=n-(n%4);
      if(n<4)return;
      var base=pool.slice(0,n).map(function(p){return p.nick});
      var totalRounds=Math.min(n-1,5);
      var rounds=[];
      for(var r=0;r<totalRounds;r++){
        var rest=base.slice(1);
        var rot=r%rest.length;
        var rotated=[base[0]].concat(rest.slice(rot).concat(rest.slice(0,rot)));
        var matches=[];
        for(var g=0;g+4<=rotated.length;g+=4){
          var grp=rotated.slice(g,g+4);
          matches.push({a:[grp[0],grp[1]],b:[grp[2],grp[3]],winner:null});
        }
        rounds.push(matches);
      }
      startTournament({type:"americano",rounds:rounds,courts:S.tourCourts,duration:S.tourDuration});
      return;
    }
    if(S.tourType==="baraonda"){
      var pool=A.filterPool(S.tourGender==="mixed"?"all":S.tourGender).filter(function(p){return selectedNicks.indexOf(p.nick)!==-1}).map(function(p){return p.nick});
      var count=1;while(count*2<=pool.length)count*=2;
      if(count<4)return;
      var usable=pool.slice(0,count);
      var primoTurno=genBaraondaRound(usable);
      var opzioni={type:"baraonda",rounds:[primoTurno],courts:S.tourCourts,duration:S.tourDuration,champion:null};
      sorteggioSlot(primoTurno,usable,function(){startTournament(opzioni)});
      return;
    }
    var teams=A.formTeams(S.tourGender,S.tourPairMode,S.tourSize,selectedNicks);
    var count=1;while(count*2<=teams.length)count*=2;
    var usable=teams.slice(0,count);
    if(usable.length<2)return;
    var round0=[];
    for(var i=0;i<usable.length;i+=2)round0.push({a:usable[i],b:usable[i+1]||null,winner:null});
    var rounds=[round0],c=round0.length;
    while(c>1){c=c/2;var rr=[];for(var j=0;j<c;j++)rr.push({a:null,b:null,winner:null});rounds.push(rr);}
    startTournament({type:"elim",rounds:rounds,courts:S.tourCourts,duration:S.tourDuration});
  },
  newTournament:function(){
    var old=S.tournament;
    if(old){
      /* il torneo è condiviso: annullandolo sparisce dai telefoni di tutti,
         quindi non basta un tocco su un link */
      var decisi=0;

      var msg=decisi?
        "Il torneo ha già "+decisi+(decisi===1?" risultato registrato":" risultati registrati")+

        "Annullare il torneo in corso?\n\nSparirà anche dai telefoni degli altri.";
      if(!confirm(msg))return;
    }
    S.tournament=null;S.tourSelected={};S.tourTeams=[];S.tourPick=null;save();render();
    if(sb&&old&&old.id)sb.from("tournaments").update({status:"done"}).eq("id",old.id).then(function(){});
  },
  pickTourWinner:function(ri,mi,team){

    if(rounds[ri+1]){
      var next=rounds[ri+1][Math.floor(mi/2)];

  pickTourGironi:function(n){S.tourGironi=n;save();render()},
  /* vincitore di una partita di girone; quando i gironi finiscono nasce la fase finale */
  pickGironeWinner:function(mi,team){

  pickAmericanoWinner:function(ri,mi,key){

  },
  pickBaraondaWinner:function(ri,mi,team){
    var round=S.tournament.rounds[ri];
    round[mi].winner=team;
    if(round.every(function(m){return m.winner})){
      var advancing=[];round.forEach(function(m){advancing=advancing.concat(m.winner)});
      if(advancing.length===2){S.tournament.champion=advancing.join(" / ");}
      else if(advancing.length>=4){
        /* anche i turni successivi passano dalla slot machine: in Baraonda
           le coppie si risorteggiano ogni volta */
        var prossimo=genBaraondaRound(advancing);
        save();render();
        sorteggioSlot(prossimo,advancing,function(){
          S.tournament.rounds.push(prossimo);save();render();pushTournament();

  setMatchScore:function(ri,mi,v){S.tournament.rounds[ri][mi].score=v;save();pushTournamentSoon();},
  pickMe:function(n){S.me=n;save();render()},
  changeMe:function(){S.me=null;save();render()},
  pickWinner:function(w){S.winner=w;save();render()},
  lockMatch:function(){
    var b=balanced();
    /* ultimo controllo prima di confermare: nessuno può giocare due partite
       nello stesso giorno alla stessa ora */
    var occupati=busyNicks(S.day,S.slot);
    var doppioni=b.teams[0].players.concat(b.teams[1].players)
      .filter(function(p){return occupati[p.nick]}).map(function(p){return p.nick});
    if(doppioni.length){
      alert(doppioni.join(" e ")+(doppioni.length===1?" gioca già":" giocano già")+
        " "+dayName(S.day)+" alle "+S.slot+".\n\nSostituiscilo dalla panchina, oppure cambia orario.");
      return;
    }
    var teamA=b.teams[0].players.map(function(p){return{nick:p.nick,elo:p.elo}});
    var teamB=b.teams[1].players.map(function(p){return{nick:p.nick,elo:p.elo}});
    var match={id:"local-"+Date.now(),day:S.day,slot:S.slot,court:S.court,stake:S.stake,
      winner:null,playedAt:null,score:"",teams:[{players:teamA},{players:teamB}]};
    S.matches=S.matches.concat([match]);S.stake="";S.pairSeed=0;S.sideSwap={};S.pairCombo=null;S.selectedSlot=null;S.screen="home";save();render();
    notificaPartita(match);
    if(sb)sb.from("matches").insert([{day:match.day,slot:match.slot,court:match.court,stake:match.stake,
      team_a:teamA,team_b:teamB}]).select().then(function(res){
        /* sostituisce l'id provvisorio con quello vero, così "Segna risultato" funziona subito */
        if(res.error||!res.data||!res.data[0])return;
        var realId=res.data[0].id;
        S.matches=S.matches.map(function(m){return m.id===match.id?Object.assign({},m,{id:realId}):m});
        save();render();
      });
  },
  goResultFor:function(id){S.activeMatchId=id;S.winner=null;S.screen="result";save();render();},
  cancelMatch:function(id){
    var match=S.matches.filter(function(m){return m.id==id})[0];
    if(!match)return;
    var ps=match.teams[0].players.concat(match.teams[1].players).map(function(p){return p.nick});
    if(!isAdminUser()&&ps.indexOf(myNick())===-1){
      alert("Questa partita la giocano "+ps.join(", ")+".\n\nTu sei "+(myNick()||"—")+
        ": può cancellarla solo chi ci gioca, oppure l'amministratore (PIN dalla Classifica).");
      return;
    }
    if(!confirm("Cancellare questa partita? Non verrà giocata."))return;
    S.matches=S.matches.filter(function(m){return m.id!==id});save();render();
    if(sb&&String(id).indexOf("local-")!==0)sb.from("matches").delete().eq("id",id).then(function(){});
  },
  /* 1) chi c'era PROPONE il risultato: non muove ancora nessun ELO */
  submitResult:function(){
    if(!S.winner)return;
    var match=S.matches.filter(function(m){return m.id==S.activeMatchId})[0];
    if(!match)return;
    var io=myNick();
    if(!io||matchNicks(match).indexOf(io)===-1){
      if(!isAdminUser()){alert("Solo chi ha giocato questa partita può registrarne il risultato.");return;}
    }
    var score=[S.set1,S.set2,S.set3].map(function(s){return String(s||"").trim()}).filter(Boolean).join(" ");
    /* il controllo punteggio/vincitore non ha senso per un pareggio dichiarato:
       lì per definizione non c'è un lato che "avrebbe dovuto" vincere di più */
    if(S.winner!=="x"&&punteggioContraddiceVincitore(score)){
      alert("Il punteggio scritto non dà la vittoria a questa squadra (sembra un pareggio o addirittura una sconfitta). "+
        "Controlla i punteggi dei set o cambia chi ha vinto.");
      return;
    }
    var conf={};
    if(io)conf[io]=true; /* il proponente conferma implicitamente */
    var prop={winner:S.winner,score:score,proposed_by:io||"admin",confirmations:conf};
    S.matches=S.matches.map(function(m){return m.id===match.id?
      Object.assign({},m,{winner:prop.winner,score:prop.score,proposedBy:prop.proposed_by,confirmations:conf}):m});
    S.winner=null;S.set1="";S.set2="";S.set3="";S.activeMatchId=null;S.screen="home";save();render();
    if(sb)sb.from("matches").update(prop).eq("id",match.id).then(function(res){
      /* se le colonne della conferma non esistono ancora, si torna al vecchio
         comportamento: risultato applicato subito, senza voto */
      if(res&&res.error)A.applyResult(match.id,prop.winner,prop.score);
    });
  },
  /* 2) gli altri confermano o smentiscono */
  confirmResult:function(id,ok){
    var m=S.matches.filter(function(x){return x.id==id})[0];
    if(!m||!isProposed(m))return;
    /* un amministratore senza un proprio profilo giocatore (sbloccato solo col
       PIN) vota comunque, sotto una chiave fissa invece del nick */
    var io=myNick()||(isAdminUser()?"admin":null);
    if(!io)return;
    if(ok&&!possoConfermare(m,io)){
      alert("Solo un avversario di chi ha proposto il risultato può confermarlo — un compagno di squadra no. "+
        "Puoi comunque smentirlo se non è andata così.");
      return;
    }
    if(!ok){
      if(!confirm("Smentire questo risultato? La proposta viene annullata e la partita torna da giocare."))return;
      S.matches=S.matches.map(function(x){return x.id===m.id?
        Object.assign({},x,{winner:null,score:"",proposedBy:null,confirmations:null}):x});
      save();render();
      if(sb)sb.from("matches").update({winner:null,score:"",proposed_by:null,confirmations:null}).eq("id",m.id).then(function(){});
      return;
    }
    var conf=Object.assign({},m.confirmations||{});conf[io]=true;
    var quanteConferme=Object.keys(conf).filter(function(n){return conf[n]}).length;
    S.matches=S.matches.map(function(x){return x.id===m.id?Object.assign({},x,{confirmations:conf}):x});
    save();render();
    /* basta UNA conferma oltre a quella implicita di chi ha proposto: non serve più
       il sì di tutti e quattro. Due persone d'accordo (proponente + un confermante)
       chiudono il risultato. */
    if(quanteConferme>=2){A.applyResult(m.id,m.winner,m.score);return;}
    if(sb)sb.from("matches").update({confirmations:conf}).eq("id",m.id).then(function(){});
  },
  /* 3) l'amministratore può chiudere senza aspettare tutti */
  forceResult:function(id){
    if(!isAdminUser())return;
    var m=S.matches.filter(function(x){return x.id==id})[0];
    if(!m||!isProposed(m))return;
    /* un amministratore che gioca anche lui questa partita non può convalidarla
       da solo: scavalcherebbe la conferma dell'avversario, che è tutto il senso
       della regola anti-furbata. Deve aspettare come chiunque altro. */
    var io=myNick();
    if(io&&matchNicks(m).indexOf(io)!==-1){
      alert("Giochi anche tu questa partita: non puoi convalidarla da amministratore, deve confermarla un avversario.");
      return;
    }
    if(!confirm("Convalidare il risultato come amministratore, senza attendere le conferme mancanti?"))return;
    A.applyResult(m.id,m.winner,m.score);
  },
  applyResult:function(id,winnerKey,score){
    var match=S.matches.filter(function(m){return m.id==id})[0];
    if(!match)return;
    A._closeMatch(match,winnerKey,score);
  },
  /* pareggio: la partita si chiude ed entra nello storico, non tocca ELO né
     penitenze (non c'è chi ha perso la sfida), ma conta per tutti e quattro
     come pareggio a sé — non più vittoria/sconfitta, non più "come se non
     fosse successo": deve vedersi nel record */
  _closeDraw:function(match,score){
    score=score||match.score||"";
    var playedAt=new Date().toISOString();
    var giocatori=matchNicks(match);
    var updates=[];
    S.roster=S.roster.map(function(r){
      if(giocatori.indexOf(r.nick)===-1)return r;
      var rec=parseRecord(r.record);
      var nr=Object.assign({},r,{delta:"pareggio",record:rec.wins+"V · "+(rec.draws+1)+"P · "+rec.losses+"S"});
      updates.push({id:r.id,nick:r.nick,draws:rec.draws+1});
      return nr;
    });
    S.matches=S.matches.filter(function(m){return m.id!==match.id});
    S.history=[Object.assign({},match,{winner:"x",playedAt:playedAt,score:score})].concat(S.history);
    S.winner=null;S.set1="";S.set2="";S.set3="";S.activeMatchId=null;S.screen="rank";save();render();
    if(sb){
      updates.forEach(function(u){
        var q=sb.from("players").update({draws:u.draws,last_delta:"pareggio"});
        (u.id?q.eq("id",u.id):q.eq("nick",u.nick)).then(function(){});
      });
      /* match.confirmations a questo punto ha già dentro chi ha davvero confermato
         (confirmResult aggiorna S.matches prima di chiamare applyResult) — va
         scritta anche sul server, altrimenti il record resta con la sola conferma
         implicita del proponente anche quando un avversario ha confermato per davvero */
      sb.from("matches").update({winner:"x",played_at:playedAt,score:score,confirmations:match.confirmations||null}).eq("id",match.id).then(function(res){
        if(res&&res.error)sb.from("matches").update({winner:"x",played_at:playedAt}).eq("id",match.id).then(function(){});
      });
    }
  },
  _closeMatch:function(match,winnerKey,score){
    if(winnerKey==="x"){A._closeDraw(match,score);return;}
    var winIdx=winnerKey==="a"?0:1,loseIdx=1-winIdx;
    var winners=match.teams[winIdx].players.map(function(p){return p.nick});
    var losers=match.teams[loseIdx].players.map(function(p){return p.nick});
    var eloOf=function(nick){var p=S.roster.filter(function(r){return r.nick===nick})[0];return p?p.elo:1500};
    /* ELO vero: quanto vale la vittoria dipende da quanto erano favoriti */
    var swing=eloSwing(avg(winners.map(eloOf)),avg(losers.map(eloOf)));
    score=score||match.score||"";
    var updates=[];
    S.roster=S.roster.map(function(r){
      var rec,nr;
      if(winners.indexOf(r.nick)!==-1){
        rec=parseRecord(r.record);
        nr=Object.assign({},r,{elo:r.elo+swing,delta:"+"+swing,record:(rec.wins+1)+"V · "+rec.draws+"P · "+rec.losses+"S"});
        updates.push({id:r.id,nick:r.nick,elo:nr.elo,wins:rec.wins+1,losses:rec.losses,last_delta:"+"+swing});
        return nr;
      }
      if(losers.indexOf(r.nick)!==-1){
        rec=parseRecord(r.record);
        nr=Object.assign({},r,{elo:Math.max(0,r.elo-swing),delta:"-"+swing,record:rec.wins+"V · "+rec.draws+"P · "+(rec.losses+1)+"S"});
        updates.push({id:r.id,nick:r.nick,elo:nr.elo,wins:rec.wins,losses:rec.losses+1,last_delta:"-"+swing});
        return nr;
      }
      return r;
    }).sort(function(a,b){return b.elo-a.elo});
    var stakeText=(match.stake||"").trim();
    if(stakeText)S.penalties=S.penalties.concat([{title:stakeText,who:losers.join(" e "),done:false}]);
    /* la partita non viene più cancellata: diventa storico */
    var playedAt=new Date().toISOString();
    S.matches=S.matches.filter(function(m){return m.id!==match.id});
    S.history=[Object.assign({},match,{winner:winnerKey,playedAt:playedAt,score:score})].concat(S.history);
    S.winner=null;S.set1="";S.set2="";S.set3="";S.activeMatchId=null;S.screen="rank";save();render();
    if(sb){
      updates.forEach(function(u){
        var q=sb.from("players").update({elo:u.elo,wins:u.wins,losses:u.losses,last_delta:u.last_delta});
        (u.id?q.eq("id",u.id):q.eq("nick",u.nick)).then(function(){});
      });
      if(stakeText)sb.from("penalties").insert([{title:stakeText,who:losers.join(" e "),done:false}]).then(function(){});
      /* se la colonna score non esiste ancora, si ripiega su vincitore + data.
         match.confirmations qui ha già dentro chi ha davvero confermato (vedi
         nota gemella in _closeDraw) — va persistita anche lei, altrimenti il
         record finale mostra solo l'implicita del proponente */
      sb.from("matches").update({winner:winnerKey,played_at:playedAt,score:score,confirmations:match.confirmations||null}).eq("id",match.id).then(function(res){
        if(res&&res.error)sb.from("matches").update({winner:winnerKey,played_at:playedAt}).eq("id",match.id).then(function(){});
      });
    }
  },
  pickStakeChip:function(l){S.stake=l;save();render()},
  togglePenalty:function(i){
    S.penalties[i].done=!S.penalties[i].done;save();render();
    var p=S.penalties[i];
    if(sb&&p.id)sb.from("penalties").update({done:p.done}).eq("id",p.id).then(function(){});
  },
  field:function(k,v){S[k]=v;save()}
};

function todayLabel(){

    "settembre","ottobre","novembre","dicembre"][d.getMonth()];

}

/* iniziali da mostrare nel quadratino: dal nome vero se c'è, altrimenti dal soprannome */
function initialsOf(nick){
  var p=S.roster.filter(function(r){return r.nick===nick})[0];
  var src=(p&&p.name&&p.name!=="—")?p.name:nick;
  return String(src).trim().split(/\s+/).map(function(w){return w[0]||""}).join("").slice(0,2).toUpperCase();
}
/* riquadro con la foto del giocatore, largo quanto il posto in campo.
   Inquadratura ancorata in alto: nelle foto è lì che sta la faccia.
   Senza foto, le iniziali grandi in lime — stessa altezza, così i due posti restano
   allineati anche se uno dei due non ha ancora caricato niente. */
function photoBox(nick,h){
  var foto=fotoDi(nick);
  var alt=h||118;
  var base="width:100%;height:"+alt+"px;border-radius:10px;overflow:hidden;";
  if(foto){
    /* "right center" invece di "center top": tante foto hanno il soggetto verso
       destra (non in cima), quindi si ancora a destra invece che al centro
       per non tagliarlo via */
    return '<div style="'+base+'background-image:url(\''+foto+'\');background-size:cover;'+
    'background-position:right center;background-color:#0F1620;border:1px solid rgba(255,255,255,.14)"></div>';
  }
  /* iniziali proporzionate all'altezza: la stessa funzione serve i riquadri grandi
     delle Coppie e quelli piccoli delle partite confermate in Gabbia */
  return '<div style="'+base+'background:rgba(200,255,61,.14);color:#C8FF3D;display:grid;'+
  'place-items:center;font-size:'+Math.max(12,Math.round(alt*0.26))+'px;font-weight:700;'+
  'letter-spacing:.04em">'+esc(initialsOf(nick))+'</div>';
}
function courtName(i){return (COURTS[i]||["Campo da definire"])[0]}
function dayName(i){return DAYS[i]||"—"}

/* blocco della proposta di risultato dentro la card della partita */
/* punteggio in stile tabellone da tennis: una riga per squadra, un numero
   per set, allineato in verticale con l'altra squadra sullo stesso set —
   invece di un testo unico tipo "7-5 1-6" difficile da abbinare a chi */
function scoreboardHtml(nomeA,nomeB,winnerKey,scoreStr,colA,colB){
  var sets=parseScore(scoreStr);
  if(!sets.length)return "";
  /* per convenzione si scrivono prima i giochi di chi ha vinto LA PARTITA: se
     ha vinto la squadra B, il primo numero di ogni set è suo, non della A */
  var aFirst=winnerKey!=="b";
  /* il colore di ogni numero segue chi ha vinto QUEL set, non chi ha vinto
     la partita: così un set vinto "in rimonta" dalla squadra che poi ha perso
     la partita si vede comunque evidenziato con lo stesso verde del vincitore */
  var cella=function(v,vinto){return '<div style="width:20px;text-align:center;font-size:13px;font-weight:700;'+
    'color:'+(vinto?"#C8FF3D":"#8C99A8")+'">'+v+'</div>'};
  var riga=function(nome,vals,altri,col){return '<div style="display:flex;align-items:center;gap:8px">'+
    '<div style="flex:1;min-width:0;font-size:13px;font-weight:700;color:'+col+';white-space:nowrap;'+
    'overflow:hidden;text-overflow:ellipsis">'+esc(nome)+'</div>'+
    '<div style="display:flex;gap:3px;flex-shrink:0">'+
    vals.map(function(v,i){return cella(v,v>altri[i])}).join("")+'</div></div>'};
  var valsA=sets.map(function(s){return aFirst?s[0]:s[1]});
  var valsB=sets.map(function(s){return aFirst?s[1]:s[0]});
  return '<div style="display:flex;flex-direction:column;gap:4px">'+riga(nomeA,valsA,valsB,colA)+riga(nomeB,valsB,valsA,colB)+'</div>';
}

function slotMinutes(t){var p=String(t).split(":");return (+p[0])*60+(+p[1]||0)}
function book(){
  /* una settimana intera a partire da oggi, con le date vere */
  var upcoming=upcomingDays(7);
  if(upcoming.map(function(u){return u.dow}).indexOf(S.day)===-1){S.day=upcoming[0].dow;save()}
  var meseIniziale=upcoming[0].mese;
  var days=upcoming.map(function(u,k){var on=S.day===u.dow;
    return '<div class="tapmute" onclick="A.pickDay('+u.dow+')" style="flex:0 0 auto;width:56px;text-align:center;'+
    'border-radius:12px;padding:10px 0;background:'+(on?"#C8FF3D":"#141E2A")+';border:1px solid '+
    (on?"#C8FF3D":"rgba(255,255,255,.12)")+';color:'+(on?"#0B1118":"#FFFFFF")+'">'+
    '<div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7">'+
    (k===0?"Oggi":DAYS[u.dow])+'</div>'+
    '<div class="anton" style="font-size:22px;margin-top:2px">'+u.num+'</div>'+
    /* il mese compare solo quando la settimana lo scavalca */
    '<div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;'+
    'height:11px;line-height:11px">'+(u.mese!==meseIniziale?MESI[u.mese]:"")+'</div></div>'}).join("");
  /* orari occupati sul campo scelto: un nuovo slot è occupato se la partita di 90
     minuti che ci inizierebbe si sovrapporrebbe a una già confermata — in entrambe
     le direzioni. Chi prenota le 18:00 blocca sia le 18:30 (dentro la sua partita)
     sia le 17:00 (che finirebbe alle 18:30, a cavallo con la sua). */
  var taken={};
  TIMES.forEach(function(t){
    var occupato=S.matches.some(function(m){
      return m.day===S.day&&m.court===S.court&&siSovrappongono(t,m.slot);
    });
    if(occupato)taken[t]=true;
  });
  var isToday=upcoming[0].dow===S.day;
  var nowMin=new Date().getHours()*60+new Date().getMinutes();
  var slots=TIMES.map(function(t){
    var busy=!!taken[t],past=isToday&&slotMinutes(t)<=nowMin,free=!busy&&!past;
    var on=S.slot===t&&free;
    var note=busy?"occupato":past?"passato":"libero";
    return '<div '+(free?'class="tapmute" onclick="A.pickSlot(\''+t+'\')"':'')+
    ' style="border-radius:12px;padding:14px 0;text-align:center;background:'+
    (!free?"#10161F":on?"rgba(200,255,61,.16)":"#141E2A")+';border:1px solid '+
    (on?"#C8FF3D":"rgba(255,255,255,.1)")+';color:'+(!free?"#5A6B7D":"#FFFFFF")+'">'+
    '<div style="font-size:16px;font-weight:700">'+t+'</div>'+
    '<div style="font-size:10px;opacity:.7;margin-top:2px">'+note+'</div></div>'}).join("");
  /* Accordion per circolo: si vede prima l'elenco dei 3 circoli (logo + nome),
     e solo aprendo quello giusto compaiono i suoi campi — evita di buttare giù
     tutti i campi di tutti i circoli insieme. */
  /* ordine alfabetico per nome, non l'ordine in cui sono stati aggiunti —
     così un nuovo circolo si inserisce da solo al posto giusto */
  var clubOrder=Object.keys(CLUBS).sort(function(a,b){return CLUBS[a].name.localeCompare(CLUBS[b].name)});
  var clubsHtml=clubOrder.map(function(key){
    var club=CLUBS[key];
    var clubCourts=COURTS.map(function(c,i){return{c:c,i:i}}).filter(function(x){return x.c[4]===key});
    var open=S.expandedClub===key;
    var courtsHtml=clubCourts.map(function(x){
      var c=x.c,i=x.i,on=S.court===i;
      /* c[1] inizia sempre con "coperto" o "scoperto" (mai il contrario: "scoperto"
         ha "coperto" a partire dal carattere 1, non 0) — il resto è un dettaglio
         facoltativo tipo "vetro nuovo" o "se non piove" */
      var alCoperto=c[1].indexOf("coperto")===0;

function pairs(){
  var b=balanced();

  var col=b.diff<=40?"#C8FF3D":b.diff<=120?"#FFFFFF":"#FF6A35";
  var teams=b.teams.map(function(t,i){
    var acc=i===0?"#C8FF3D":"#FF6A35";
    var pl=t.players.map(function(p,j){
      /* si usa l'indice nella formazione, non la posizione a schermo */
      var slot=t.idx[j],sel=S.selectedSlot===slot,side=j===0?"Sinistra":"Destra";
      var occupato=!!busyNicks(S.day,S.slot)[p.nick];
      return '<div class="tapmute" onclick="A.pickSlotIdx('+slot+')" style="flex:1;min-width:0;background:rgba(11,17,24,.6);'+
      'border:2px solid '+(sel?"#C8FF3D":occupato?"#FF6A35":"rgba(255,255,255,.1)")+';border-radius:12px;padding:10px">'+
      '<div style="position:relative">'+photoBox(p.nick,172)+
      (occupato?'<div style="position:absolute;top:6px;left:6px;right:6px;background:rgba(255,106,53,.92);'+
      'color:#0B1118;border-radius:6px;padding:4px 6px;font-size:9px;font-weight:700;letter-spacing:.06em;'+
      'text-transform:uppercase;text-align:center">Gioca già</div>':'')+
      /* il soprannome non si ripete qui: c'è già nel titolo della coppia qui sopra.

      '<div style="position:absolute;left:0;right:0;bottom:0;height:52px;border-radius:0 0 10px 10px;'+
      'background:linear-gradient(180deg,rgba(11,17,24,0),rgba(11,17,24,.85))"></div>'+

      'align-items:flex-end;gap:6px">'+
      '<div style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#FFFFFF;opacity:.85">'+side+'</div>'+
      '<div style="font-size:13px;font-weight:700;color:#C8FF3D">'+p.elo+'</div></div></div>'+
      '<div style="font-size:11px;color:#8C99A8;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(p.name)+'</div>'+
      '</div>'}).join("");
    return '<div style="border-radius:18px;padding:16px;background:'+
    (i===0?"linear-gradient(160deg,#18271E,#111A15)":"linear-gradient(160deg,#27180F,#1A1210)")+
    ';border:1px solid '+(i===0?"rgba(200,255,61,.28)":"rgba(255,106,53,.28)")+'">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'+
    '<div class="anton" style="font-size:21px;color:'+acc+';min-width:0;white-space:nowrap;'+
    'overflow:hidden;text-overflow:ellipsis">'+esc(t.players[0].nick+" / "+t.players[1].nick)+'</div>'+
    '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'+
    '<div style="font-size:12px;color:#8C99A8">'+t.sum+' ELO</div>'+
    '<div class="tapmute" onclick="A.swapSides('+i+')" style="width:28px;height:28px;'+
    'border-radius:50%;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;'+
    'font-size:13px;flex-shrink:0">⇄</div></div></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+pl+'</div>'+
    '<div style="font-size:11px;color:#8C99A8;margin-top:12px;line-height:1.5">'+
    esc(ROASTS[(S.pairSeed*2+i)%ROASTS.length])+'</div></div>'}).join("");
  var active=S.selectedSlot!==null;
  var busy=busyNicks(S.day,S.slot);
  var benchPool=S.roster.filter(function(x){return S.lineup.indexOf(x.nick)===-1});
  var bench=benchPool.length?benchPool.map(function(x){var isBusy=!!busy[x.nick];
    return '<div '+((active&&!isBusy)?'class="tapmute" onclick="A.swapBench(\''+js(x.nick)+'\')"':'')+
    ' style="display:flex;align-items:center;gap:8px;background:#141E2A;border:1px solid rgba(255,255,255,.12);'+
    'border-radius:999px;padding:11px 15px;font-size:14px;opacity:'+((active&&!isBusy)?"1":"0.4")+'">'+
    '<span style="font-weight:700">'+esc(x.nick)+'</span>'+
    '<span style="color:#8C99A8;font-size:11px">'+(isBusy?"già impegnato":x.elo)+'</span></div>'}).join(""):
    '<div style="font-size:12px;color:#8C99A8">Nessuno in panchina: sono già tutti in campo.</div>';
  var hint=active?"Giocatore selezionato ✓ — ora tocca chi lo sostituisce dalla panchina.":
    "① Tocca un giocatore in campo qui sopra (si evidenzia) — ② poi tocca chi vuoi far entrare qui sotto.";
  var chips=["4 birre","Porti le palline","Foto con la fascetta"].map(function(c){
    return '<div class="tapmute" onclick="A.pickStakeChip(\''+c+'\')" style="background:#141E2A;border:1px solid rgba(255,255,255,.14);'+
    'border-radius:999px;padding:9px 14px;font-size:12px">'+c+'</div>'}).join("");
  return '<div class="pad">'+
  '<div style="background:#141E2A;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px;'+
  'display:flex;justify-content:space-between;align-items:center;gap:12px">'+
  '<div><div class="kick">Squilibrio</div>'+
  '<div class="anton" style="font-size:26px;color:'+col+';line-height:1.1">'+lbl+'</div></div>'+
  '<div class="tapmute" onclick="A.shuffle()" style="border:1px solid rgba(255,255,255,.2);border-radius:12px;'+
  'padding:13px 16px;font-size:14px;font-weight:700;white-space:nowrap">Rimescola</div></div>'+
  '<div style="display:flex;flex-direction:column;gap:10px">'+teams+'</div>'+
  '<div><div class="kick" style="margin-bottom:10px">'+hint+'</div>'+
  '<div style="display:flex;flex-wrap:wrap;gap:8px">'+bench+'</div></div>'+

  '<input value="'+esc(S.stake)+'" oninput="A.field(\'stake\',this.value)" placeholder="es. 4 birre per chi perde" '+
  'style="width:100%;background:#141E2A;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:14px;'+
  'color:#FFFFFF;font-size:14px;margin-bottom:8px">'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap">'+chips+'</div></div>'+
  '<div class="tapmute" onclick="A.lockMatch()" style="background:#C8FF3D;color:#0B1118;border-radius:14px;'+
  'padding:17px;text-align:center;font-weight:700;font-size:16px">Blocca le coppie</div></div>';
}

function resultScreen(){
  var match=S.matches.filter(function(m){return m.id==S.activeMatchId})[0];
  if(!match)return '<div class="pad"><div class="kick">Nessuna partita selezionata.</div></div>';
  var opts=match.teams.map(function(t,i){var key=i===0?"a":"b",sel=S.winner===key,acc=i===0?"#C8FF3D":"#FF6A35";
    return '<div class="tapmute" onclick="A.pickWinner(\''+key+'\')" style="border-radius:14px;padding:16px;'+

    /* pareggio: quando davvero non c'è un vincitore (es. 1-1 nei set senza aver

    'color:#8C99A8;text-align:center">Pareggio — nessuno vince</div>';
  var inp=function(k,ph){return '<input value="'+esc(S[k])+'" oninput="A.field(\''+k+'\',this.value)" placeholder="'+ph+'" '+

    'color:#FFFFFF;font-size:15px;text-align:center">'};

  '<div style="font-size:13px;color:#8C99A8;line-height:1.5">Segna chi ha vinto e il punteggio dei set. L\'ELO si aggiorna subito.</div>'+

  '<div style="display:flex;flex-direction:column;gap:8px">'+opts+'</div></div>'+
  '<div><div class="kick" style="margin-bottom:4px">Punteggio set (opzionale)</div>'+
  '<div style="font-size:11px;color:#8C99A8;margin-bottom:10px;line-height:1.4">Scrivi prima i giochi '+
  'di chi ha vinto: es. 6-3. Servono per le statistiche su set e giochi.</div>'+
  '<div style="display:flex;gap:8px">'+inp("set1","6-1")+inp("set2","6-2")+inp("set3","6-3")+'</div></div>'+
  '<div class="tapmute" onclick="A.submitResult()" style="background:#C8FF3D;color:#0B1118;border-radius:14px;padding:17px;'+
  'text-align:center;font-weight:700;font-size:16px;margin-top:8px">Registra risultato</div></div>';

function rank(){
  /* chi non ha ancora giocato nessuna partita non compare in classifica: a
     1500 tondo non dice niente su quanto sia forte, occuperebbe solo posto */
  var haGiocato=function(r){var rec=parseRecord(r.record);return rec.wins>0||rec.draws>0||rec.losses>0};
  var males=S.roster.filter(function(r){return r.gender!=="F"&&haGiocato(r)});
  var females=S.roster.filter(function(r){return r.gender==="F"&&haGiocato(r)});
  var king=males[0],queen=females[0];
  var filter=S.rankFilter||"m";
  var list=filter==="f"?females:males;
  var tabs=[["m","King of the Padel"],["f","Queen of the Padel"]].map(function(t){var on=filter===t[0];
    return '<div class="tapmute" onclick="A.pickRankFilter(\''+t[0]+'\')" style="flex:1;text-align:center;border-radius:12px;'+
    'padding:12px 6px;background:'+(on?"#C8FF3D":"#141E2A")+';border:1px solid '+(on?"#C8FF3D":"rgba(255,255,255,.16)")+
    ';color:'+(on?"#0B1118":"#FFFFFF")+';font-weight:700;font-size:12px">'+t[1]+'</div>'}).join("");
  var kq='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
  '<div style="background:linear-gradient(160deg,#1A2432,#0F1620);border:1px solid rgba(200,255,61,.3);border-radius:16px;padding:14px">'+
  '<div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#C8FF3D">King of the Padel</div>'+
  '<div class="anton" style="font-size:22px;margin-top:8px">'+(king?esc(king.nick):"—")+'</div>'+
  '<div style="font-size:12px;color:#8C99A8;margin-top:2px">'+(king?king.elo:0)+' ELO</div></div>'+
  '<div style="background:linear-gradient(160deg,#271826,#1A1015);border:1px solid rgba(255,106,53,.3);border-radius:16px;padding:14px">'+
  '<div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#FF6A35">Queen of the Padel</div>'+
  '<div class="anton" style="font-size:22px;margin-top:8px">'+(queen?esc(queen.nick):"—")+'</div>'+
  '<div style="font-size:12px;color:#8C99A8;margin-top:2px">'+(queen?queen.elo:0)+' ELO</div></div></div>';
  var pod=[1,0,2].map(function(i){var r=list[i]||{nick:"—",elo:0,delta:""},f=i===0;
    return '<div style="flex:1;background:'+(f?"linear-gradient(180deg,rgba(200,255,61,.18),#141E2A)":"#141E2A")+
    ';border:1px solid '+(f?"rgba(200,255,61,.5)":"rgba(255,255,255,.12)")+
    ';border-radius:16px 16px 8px 8px;padding:14px 10px;height:'+(f?"168px":i===1?"146px":"128px")+
    ';display:flex;flex-direction:column;justify-content:flex-end;gap:4px">'+
    '<div class="anton" style="font-size:26px;color:'+(f?"#C8FF3D":"#8C99A8")+';line-height:1">'+(i+1)+'°</div>'+
    '<div style="font-size:15px;font-weight:700">'+esc(r.nick)+'</div>'+
    '<div style="font-size:11px;color:#8C99A8">'+r.elo+' · '+esc(r.delta)+'</div></div>'}).join("");
  var rows=list.map(function(r,i){
    var dc=r.delta.indexOf("+")===0?"#C8FF3D":r.delta.indexOf("-")===0?"#FF6A35":"#8C99A8";
    var me=isMe(r);
    return '<div style="display:flex;align-items:center;gap:12px;background:'+
    (me?"rgba(200,255,61,.07)":"#141E2A")+';border:1px solid '+
    (me?"rgba(200,255,61,.35)":"rgba(255,255,255,.08)")+';border-radius:12px;padding:12px 13px">'+
    '<div class="anton" style="width:24px;font-size:18px;color:#8C99A8">'+(i+1)+'</div>'+
    '<div '+(isAdminUser()?'class="tapmute" onclick="A.openPlayer(\''+js(r.nick)+'\')"':'')+' style="flex:1">'+
    '<div style="font-size:15px;font-weight:700">'+
    (r.nationality?'<span style="font-size:13px">'+flagOf(r.nationality)+'</span> ':'')+esc(r.nick)+
    (isAdminUser()?' <span style="font-size:11px;color:#C8FF3D;font-weight:600">modifica</span>':'')+'</div>'+
    '<div style="font-size:11px;color:#8C99A8">'+esc(r.record)+'</div></div>'+
    '<div style="text-align:right"><div style="font-size:15px;font-weight:700">'+r.elo+'</div>'+
    '<div style="font-size:11px;color:'+dc+'">'+esc(r.delta)+'</div></div>'+
    (isAdminUser()?'<div class="tapmute" onclick="A.remove(\''+js(r.nick)+'\')" '+
    'style="width:44px;height:44px;margin:-9px -8px -9px 0;border-radius:50%;display:grid;place-items:center;'+
    'color:#8C99A8;font-size:18px">×</div>':'')+'</div>'}).join("");
  /* chi non ha ancora giocato non compare in classifica (ha senso per tutti),
     ma l'amministratore deve comunque poterlo raggiungere per modificarlo o
     eliminarlo — altrimenti quei profili diventano irraggiungibili */
  var nonGiocato=isAdminUser()?S.roster.filter(function(r){return !haGiocato(r)})
    .sort(function(a,b){return a.nick.localeCompare(b.nick)}):[];
  var nonGiocatoRows=nonGiocato.map(function(r){
    return '<div style="display:flex;align-items:center;gap:12px;background:#141E2A;'+
    'border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 13px">'+

    '<div style="font-size:11px;color:#8C99A8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+
    esc(r.name)+' · mai giocato</div></div>'+
    '<div class="tapmute" onclick="A.remove(\''+js(r.nick)+'\')" style="width:44px;height:44px;'+
    'margin:-9px -8px -9px 0;border-radius:50%;display:grid;place-items:center;color:#8C99A8;'+
    'font-size:18px;flex-shrink:0">×</div></div>'}).join("");
  var nonGiocatoHtml=nonGiocato.length?
    '<div><div class="kick" style="margin-bottom:10px">Non hanno ancora giocato ('+nonGiocato.length+')</div>'+

  return '<div class="pad">'+
  (isAdminUser()?'<div class="tapmute" onclick="A.nav(\'add\')" style="display:flex;align-items:center;justify-content:center;gap:8px;'+
  'background:#141E2A;border:1px dashed rgba(200,255,61,.4);border-radius:12px;padding:14px;color:#C8FF3D;'+
  'font-weight:700;font-size:14px">+ Iscrivi un nuovo matto</div>':'')+
  kq+
  '<div><div class="kick" style="margin:4px 0 -4px">Classifiche</div></div>'+

/* vittorie consecutive più recenti, lette dallo storico (dal più recente in giù) */
function winStreak(nick){
  var s=0;
  for(var i=0;i<S.history.length;i++){
    var m=S.history[i];
    if(m.winner==="x"){
      /* pareggio: non è una vittoria, quindi interrompe la striscia — ma solo
         se il giocatore c'era davvero, altrimenti è una partita che non lo riguarda */
      if(matchNicks(m).indexOf(nick)===-1)continue;
      break;
    }
    var wi=m.winner==="b"?1:0;
    var won=m.teams[wi].players.some(function(p){return p.nick===nick});
    var lost=m.teams[1-wi].players.some(function(p){return p.nick===nick});
    if(!won&&!lost)continue;
    if(!won)break;
    s++;
  }
  return s;
}
/* premi calcolati sui dati veri: niente bacheca uguale per tutti */
function awardsFor(p,rankPos){
  var rec=parseRecord(p.record),games=rec.wins+rec.draws+rec.losses,out=[];
  if(rankPos===1)out.push(["1","In vetta alla Gabbia",(p.gender==="F"?"Queen":"King")+" of the Padel"]);
  else if(rankPos>0&&rankPos<=3)out.push(["3","Sul podio",rankPos+"º posto in classifica"]);
  var st=winStreak(p.nick);
  if(st>=2)out.push(["▲","Serie aperta",st+" vittorie di fila"]);
  if(games>=10)out.push(["V","Veterano",games+" partite giocate"]);
  if(games>=5&&rec.wins/games>=0.6)out.push(["%","Cecchino",Math.round(rec.wins/games*100)+"% di vittorie"]);
  if(rec.wins>=1&&games<5)out.push(["✓","Sbloccato","prima vittoria in Gabbia"]);
  return out;
}

/* ---------- Statistiche giocatore ----------
   Tutto si ricava dallo storico: team_a/team_b conservano l'ELO di ciascuno
   al momento in cui la partita è stata bloccata, quindi la curva dell'ELO
   esce gratis senza colonne aggiuntive. */
function slotBand(slot){
  var h=Math.floor(slotMinutes(slot)/60);
  return h<19?"Pomeriggio":h<21?"Sera":"Tarda sera";
}
function bump(map,key,won){var e=map[key]||(map[key]={w:0,l:0});if(won)e.w++;else e.l++}
/* "6-3 6-4" -> [[6,3],[6,4]]. Per convenzione il primo numero è di chi ha vinto
   la partita: la schermata Risultato lo dice esplicitamente. */
function parseScore(s){
  return String(s||"").trim().split(/\s+/).map(function(t){
    var m=t.match(/^(\d+)\s*[-–]\s*(\d+)$/);return m?[+m[1],+m[2]]:null;
  }).filter(Boolean);
}
function quandoFu(iso){
  var d=new Date(iso);if(isNaN(d))return "";
  var a=new Date(),oggi=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  var g=Math.round((oggi-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  if(g<=0)return "oggi";
  if(g===1)return "ieri";
  if(g<7)return g+" giorni fa";
  if(g<14)return "una settimana fa";
  if(g<60)return Math.floor(g/7)+" settimane fa";
  return Math.floor(g/30)+" mesi fa";
}
function dataBreve(iso){
  var d=new Date(iso);if(isNaN(d))return "";
  return d.getDate()+" "+MESI[d.getMonth()];
}
function statsFor(nick){
  var played=S.history.slice().reverse(); /* dal più vecchio al più recente */
  var series=[],wins=0,draws=0,losses=0,partners={},rivals={},clubs={},bands={};
  var lati={Sinistra:{w:0,l:0},Destra:{w:0,l:0}};
  var setV=0,setP=0,giochiF=0,giochiS=0,v20=0,v21=0,ultima=null;
  var migliore=null,peggiore=null;
  played.forEach(function(m){
    var myTeam=-1;
    [0,1].forEach(function(t){if(m.teams[t].players.some(function(p){return p.nick===nick}))myTeam=t});
    if(myTeam===-1)return;
    var squadra=m.teams[myTeam].players;
    var mine=squadra.filter(function(p){return p.nick===nick})[0];
    if(mine&&typeof mine.elo==="number")series.push(mine.elo);
    if(m.playedAt)ultima=m.playedAt;
    var isDraw=m.winner==="x";
    /* i set contano comunque, pareggio o no: ogni set ha un vincitore vero
       anche dentro una partita finita pari (es. 7-5 poi 1-6). Senza un
       vincitore di partita a cui appoggiarsi, si segue la stessa convenzione
       usata nel tabellone: i numeri della squadra A vengono scritti per primi */
    var mioNumeroPrimo=isDraw?(myTeam===0):(myTeam===(m.winner==="a"?0:1));
    var sets=parseScore(m.score),miei=0,loro=0;
    sets.forEach(function(s){
      var a=mioNumeroPrimo?s[0]:s[1],b=mioNumeroPrimo?s[1]:s[0];
      miei+=a;loro+=b;
      if(a>b)setV++;else if(b>a)setP++;
    });
    if(sets.length)giochiF+=miei,giochiS+=loro;
    /* pareggio: conta a sé (non è né una vittoria né una sconfitta), e non
       entra nelle statistiche di lato/compagni/avversari/circolo/orario né
       nei record di vittoria/sconfitta più netta, che si basano tutte su un
       "won" che qui non esisterebbe davvero */
    if(isDraw){draws++;return;}
    var won=myTeam===(m.winner==="b"?1:0);
    if(won)wins++;else losses++;
    /* lato del campo: nella squadra il primo è a sinistra, il secondo a destra */
    var pos=squadra.map(function(p){return p.nick}).indexOf(nick);
    if(pos===0||pos===1)bump(lati,pos===0?"Sinistra":"Destra",won);
    squadra.forEach(function(p){if(p.nick!==nick)bump(partners,p.nick,won)});
    m.teams[1-myTeam].players.forEach(function(p){bump(rivals,p.nick,won)});
    bump(clubs,(COURTS[m.court]||[])[4]||"?",won);
    bump(bands,slotBand(m.slot),won);
    if(sets.length){
      if(won){if(sets.length<=2)v20++;else v21++;}
      var scarto=miei-loro,etichetta=sets.map(function(s){
        return (mioNumeroPrimo?s[0]:s[1])+"-"+(mioNumeroPrimo?s[1]:s[0])}).join(" ");
      var contro=m.teams[1-myTeam].players.map(function(p){return p.nick}).join(" / ");
      if(won&&(!migliore||scarto>migliore.scarto))migliore={scarto:scarto,score:etichetta,contro:contro};
      if(!won&&(!peggiore||scarto<peggiore.scarto))peggiore={scarto:scarto,score:etichetta,contro:contro};
    }
  });
  var cur=(S.roster.filter(function(r){return r.nick===nick})[0]||{}).elo;
  if(typeof cur==="number")series.push(cur);
  return{series:series,wins:wins,draws:draws,losses:losses,games:wins+draws+losses,
    partners:partners,rivals:rivals,clubs:clubs,bands:bands,lati:lati,
    setV:setV,setP:setP,giochiF:giochiF,giochiS:giochiS,v20:v20,v21:v21,
    migliore:migliore,peggiore:peggiore,ultima:ultima,
    conPunteggio:setV+setP>0};
}
function pct(w,l){var g=w+l;return g?Math.round(w/g*100):0}
/* miglior compagno: percentuale di vittorie, a parità vince chi ha giocato di più */
function bestOf(map,by){
  var keys=Object.keys(map);if(!keys.length)return null;
  keys.sort(function(a,b){
    var A=map[a],B=map[b];
    if(by==="rivale")return (B.l-B.w)-(A.l-A.w)||B.l-A.l;
    return pct(B.w,B.l)-pct(A.w,A.l)||(B.w+B.l)-(A.w+A.l);
  });
  return{nick:keys[0],rec:map[keys[0]]};
}
function sparkline(vals){
  if(vals.length<2)return "";
  var W=300,H=80,pad=8;
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),span=(max-min)||1;
  var pts=vals.map(function(v,i){
    var x=pad+i*(W-pad*2)/(vals.length-1);
    var y=H-pad-((v-min)/span)*(H-pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  });
  var last=pts[pts.length-1].split(",");
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:80px;display:block" fill="none">'+
    '<polyline points="'+pts.join(" ")+'" stroke="#C8FF3D" stroke-width="2" '+
    'vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="3.5" fill="#C8FF3D"/></svg>';
}
/* riga con barra: usata per circoli e fasce orarie */
function barRow(label,rec){
  var p=pct(rec.w,rec.l);
  return '<div style="background:#141E2A;border:0.5px solid #26313F;border-radius:12px;padding:13px">'+
  '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">'+
  '<div style="font-size:15px;font-weight:600;color:#FFFFFF">'+esc(label)+'</div>'+
  '<div style="font-size:13px;color:#8C99A8">'+rec.w+'V · '+rec.l+'S · '+p+'%</div></div>'+
  '<div style="height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden">'+
  '<div style="height:100%;width:'+p+'%;background:#C8FF3D"></div></div></div>';
}
function highlightRow(glyph,title,sub){
  return '<div style="display:flex;gap:12px;align-items:center;background:#141E2A;'+
  'border:0.5px solid #26313F;border-radius:12px;padding:13px">'+
  '<div style="width:32px;height:32px;border-radius:8px;background:rgba(200,255,61,.14);color:#C8FF3D;'+
  'display:grid;place-items:center;font-size:14px;font-weight:600;flex-shrink:0">'+esc(glyph)+'</div>'+
  '<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;color:#FFFFFF">'+esc(title)+'</div>'+
  '<div style="font-size:11px;color:#8C99A8">'+esc(sub)+'</div></div></div>';
}

    card.style.cssText="width:100%;max-width:420px;background:linear-gradient(180deg,#1A2432,#0F1620);"+

      "flex-direction:column;gap:8px;";
    card.appendChild(riga(g.a));

    vs.style.cssText="text-align:center;font-size:10px;letter-spacing:.16em;color:#8C99A8;";
    vs.textContent="VS";

    card.appendChild(riga(g.b));
    ov.appendChild(card);
  });

  var azione=document.createElement("div");

  var nota=document.createElement("div");
  nota.style.cssText="font-size:12px;color:#5A6B7D;";
  nota.textContent="tocca per saltare";
  azione.appendChild(nota);
  ov.appendChild(azione);
  document.body.appendChild(ov);

  var giro=setInterval(function(){
    celle.forEach(function(c){
      if(c.fermo)return;
      c.el.textContent=pool[Math.floor(Math.random()*pool.length)];
    });
  },70);
  var passo=celle.length>8?150:250;

  var fermaCella=function(c){
    if(c.fermo)return;
    c.fermo=true;c.el.textContent=c.finale;

    c.el.style.transform="scale(1.06)";

    clearInterval(giro);timers.forEach(clearTimeout);
    celle.forEach(fermaCella);
    if(navigator.vibrate)navigator.vibrate([25,60,25]);
    azione.innerHTML="";
    var btn=document.createElement("div");
    btn.style.cssText="background:#C8FF3D;color:#0B1118;border-radius:14px;padding:15px 28px;"+
      "font-weight:700;font-size:15px;cursor:pointer;";

    btn.onclick=function(e){e.stopPropagation();chiudi()};

/* ---------- TORNEO A GIRONI ----------
   rounds[0] = tutte le partite dei gironi, ognuna con il suo indice di girone in `g`
   rounds[1..] = fase finale a eliminazione, creata quando i gironi sono completi.
   La composizione dei gironi non si salva a parte: si ricava dalle partite, perché
   nel girone all'italiana ogni coppia incontra tutte le altre e quindi compare. */
function teamKey(t){return (t||[]).join("|")}
function genGironi(teams,nG){
  var gruppi=[],i;
  for(i=0;i<nG;i++)gruppi.push([]);
  /* distribuzione a serpentina: le coppie forti finiscono in gironi diversi */
  teams.forEach(function(t,k){
    var giro=Math.floor(k/nG),pos=k%nG;
    gruppi[giro%2===0?pos:nG-1-pos].push(t);
  });
  var matches=[];
  gruppi.forEach(function(gr,gi){
    for(var a=0;a<gr.length;a++)for(var b=a+1;b<gr.length;b++)
      matches.push({a:gr[a],b:gr[b],winner:null,g:gi});
  });
  return matches;
}
function gironeTabella(rounds,g){
  var tab={},ordine=[];
  var add=function(t){var k=teamKey(t);
    if(!tab[k]){tab[k]={team:t,v:0,s:0,setV:0,setP:0,gf:0,gs:0};ordine.push(k)}
    return tab[k]};
  (rounds[0]||[]).forEach(function(m){
    if(m.g!==g)return;
    var A=add(m.a),B=add(m.b);
    if(!m.winner)return;
    var aVince=teamKey(m.winner)===teamKey(m.a);
    var W=aVince?A:B,L=aVince?B:A;
    W.v++;L.s++;
    parseScore(m.score).forEach(function(s){
      W.gf+=s[0];W.gs+=s[1];L.gf+=s[1];L.gs+=s[0];
      if(s[0]>s[1]){W.setV++;L.setP++}else{W.setP++;L.setV++}
    });
  });
  return ordine.map(function(k){return tab[k]}).sort(function(x,y){
    return y.v-x.v||(y.setV-y.setP)-(x.setV-x.setP)||(y.gf-y.gs)-(x.gf-x.gs)});
}
function numeroGironi(rounds){
  var n=0;(rounds[0]||[]).forEach(function(m){if(m.g+1>n)n=m.g+1});return n;
}
function gironiCompleti(rounds){
  var ms=rounds[0]||[];
  return ms.length>0&&ms.every(function(m){return !!m.winner});
}
/* incroci: la prima di un girone contro la seconda dell'altro */
function coppieQualificate(rounds){
  var nG=numeroGironi(rounds),teste=[],i;
  for(i=0;i<nG;i++){var t=gironeTabella(rounds,i);
    teste.push({prima:t[0]&&t[0].team,seconda:t[1]&&t[1].team})}
  var out=[];
  if(nG===1){if(teste[0].prima&&teste[0].seconda)out.push([teste[0].prima,teste[0].seconda]);return out}
  for(i=0;i<nG;i+=2){
    var A=teste[i],B=teste[i+1];if(!B)break;
    if(A.prima&&B.seconda)out.push([A.prima,B.seconda]);
    if(B.prima&&A.seconda)out.push([B.prima,A.seconda]);
  }
  return out;
}
function bracketDaCoppie(coppie){
  var r0=coppie.map(function(c){return{a:c[0],b:c[1],winner:null}});
  var rounds=[r0],c=r0.length;
  while(c>1){c=Math.ceil(c/2);var rr=[];for(var j=0;j<c;j++)rr.push({a:null,b:null,winner:null});rounds.push(rr)}
  return rounds;
}
function genBaraondaRound(players){
  var shuffled=players.slice();
  for(var i=shuffled.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=t;}
  var matches=[];
  for(var k=0;k+4<=shuffled.length;k+=4)matches.push({a:[shuffled[k],shuffled[k+1]],b:[shuffled[k+2],shuffled[k+3]],winner:null});
  return matches;
}

    '<div style="font-size:12px;color:#8C99A8">Campi: '+S.tournament.courts+(S.tournament.duration?" · Match a "+S.tournament.duration+" min":" · Nessun limite di tempo")+'</div>'+
    '<div class="kick">Classifica torneo</div>'+
    '<div style="display:flex;flex-direction:column;gap:6px">'+standingsHtml+'</div>'+
    roundsHtml+
    '<div class="tapmute" onclick="A.newTournament()" style="text-align:center;font-size:13px;color:#FF6A35;padding:12px;text-decoration:underline">Annulla e ricomincia</div></div>';
  }
  var rounds=S.tournament.rounds;
  var champion=null;
  var last=rounds[rounds.length-1];
  if(last&&last[0]&&last[0].winner)champion=last[0].winner.join(" / ");
  var champHtml=champion?('<div style="background:linear-gradient(160deg,#1A2432,#0F1620);border:1px solid rgba(200,255,61,.4);'+
    'border-radius:16px;padding:18px;text-align:center">'+
    '<div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#C8FF3D">Campione del torneo</div>'+
    '<div class="anton" style="font-size:24px;margin-top:8px">'+esc(champion)+'</div></div>'):"";
  var roundsHtml=bracketHtml(rounds);
  ensureTimerLoop();
  return '<div class="pad">'+
  '<div style="font-size:12px;color:#8C99A8;margin-bottom:8px">Campi: '+S.tournament.courts+(S.tournament.duration?" · Match a "+S.tournament.duration+" min":" · Nessun limite di tempo")+'</div>'+
  champHtml+roundsHtml+
  '<div class="tapmute" onclick="A.newTournament()" style="text-align:center;font-size:13px;color:#FF6A35;padding:12px;text-decoration:underline">Annulla e ricomincia</div></div>';
}

var TB=(function(){
  var ICONS={
    home:'<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
    book:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
    pairs:'<circle cx="8" cy="9" r="3.2"/><circle cx="16.5" cy="9" r="3.2"/><path d="M2.5 20c.6-3 2.8-4.6 5.5-4.6S13 17 13.6 20M11.5 20c.5-2.8 2.6-4.6 5-4.6s4.4 1.7 5 4.6"/>',
    rank:'<path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/>',
    tour:'<path d="M3 5h5v6H3zM3 15h5v5H3zM16 8h5v8h-5zM8 8h4v4H8zM8 17h4v-5"/>',
    me:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-4 3.9-6 7.5-6s6.7 2 7.5 6"/>'
  };
  var TABS=[["home","Gabbia"],["book","Prenota"],["pairs","Coppie"],["rank","Classifica"],["tour","Torneo"],["me","Io"]];
  var el,svg,path,bubble,items=[],idx=0,cx=0,target=0,vel=0,raf=0,H=76,BW=52;

  function icon(k,color){
    return '<svg class="tb-ico" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+ICONS[k]+'</svg>';
  }
  function shape(W,c){
    var r=38,d=26,ya=3,dip=30;
    var l=Math.max(0,c-r-d),rr=Math.min(W,c+r+d);
    return 'M0,0 L'+l.toFixed(1)+',0'
      +' C'+(l+d*0.55).toFixed(1)+',0 '+(c-r-2).toFixed(1)+','+ya+' '+(c-r).toFixed(1)+','+ya
      +' C'+(c-r*0.45).toFixed(1)+','+ya+' '+(c-r*0.58).toFixed(1)+','+dip+' '+c.toFixed(1)+','+dip
      +' C'+(c+r*0.58).toFixed(1)+','+dip+' '+(c+r*0.45).toFixed(1)+','+ya+' '+(c+r).toFixed(1)+','+ya
      +' C'+(c+r+2).toFixed(1)+','+ya+' '+(rr-d*0.55).toFixed(1)+',0 '+rr.toFixed(1)+',0'
      +' L'+W+',0 L'+W+','+H+' L0,'+H+' Z';
  }
  function paint(){
    var W=el.clientWidth||390;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    path.setAttribute('d',shape(W,cx));
    bubble.style.left=(cx-BW/2)+'px';
    bubble.style.top='2px';
  }
  function centerOf(i){
    var it=items[i]; if(!it) return 0;
    return it.offsetLeft+it.offsetWidth/2;
  }
  function tick(){
    var k=210,damp=26,dt=1/60;
    var a=k*(target-cx)-damp*vel;
    vel+=a*dt; cx+=vel*dt;
    paint();
    if(Math.abs(target-cx)<0.3&&Math.abs(vel)<0.5){cx=target;vel=0;paint();raf=0;return}
    raf=requestAnimationFrame(tick);
  }
  function select(i,instant){
    if(i<0)i=0;
    idx=i;
    items.forEach(function(it,n){it.classList.toggle('on',n===i)});
    bubble.innerHTML=icon(TABS[i][0],'#0B1118');
    bubble.firstChild.style.opacity='1';
    target=centerOf(i);
    if(instant||!cx){cx=target;vel=0;if(raf){cancelAnimationFrame(raf);raf=0}paint();return}
    if(!raf)raf=requestAnimationFrame(tick);
  }
  function init(){
    el=document.getElementById('tabbar');
    el.style.height='calc('+H+'px + env(safe-area-inset-bottom))';
    el.innerHTML='<svg class="tb-shape" preserveAspectRatio="none" viewBox="0 0 390 '+H+'">'+
      '<path fill="#141E2A" stroke="#26313F" stroke-width="0.5"></path></svg>'+
      '<div class="tb-items">'+TABS.map(function(t){
        return '<div class="tb-item" data-k="'+t[0]+'">'+icon(t[0],'#8C99A8')+'<div class="tb-lbl">'+t[1]+'</div></div>'
      }).join('')+'</div><div class="tb-bubble"></div>';
    svg=el.querySelector('svg');path=svg.querySelector('path');bubble=el.querySelector('.tb-bubble');
    var W=el.clientWidth||390;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    items=Array.prototype.slice.call(el.querySelectorAll('.tb-item'));
    items.forEach(function(it){it.addEventListener('click',function(){A.nav(it.getAttribute('data-k'))})});
    window.addEventListener('resize',function(){
      var w=el.clientWidth||390;svg.setAttribute('viewBox','0 0 '+w+' '+H);target=centerOf(idx);cx=target;paint();
    });
    select(0,true);
  }
  return {init:init,select:select};
})();

function tabIndex(){
  var s=S.screen;
  if(s==="add"||s==="result"||s==="admedit")return 3;
  if(s==="editme"||s==="stats")return 5;
  return Math.max(0,["home","book","pairs","rank","tour","me"].indexOf(s));
}

var tabsReady=false;
/* render() riscrive tutto #view, quindi il contenitore che scorre viene ricreato da zero
   e riparte dall'alto: spuntando un giocatore in fondo alla lista la pagina saltava su.
   Qui si annota dove eravamo e si rimette la stessa posizione — ma solo se si resta
   sulla stessa schermata, perché cambiando schermata è giusto ripartire dall'inizio. */
var lastScreen=null;
function readScroll(view){
  var s=view.querySelector(".scroll");
  var b=view.querySelector(".bkt-scroll");
  return{y:s?s.scrollTop:0,x:b?b.scrollLeft:0};
}
function writeScroll(view,pos,stessaSchermata){
  if(!stessaSchermata)return;
  var s=view.querySelector(".scroll");
  if(s&&pos.y)s.scrollTop=pos.y;
  var b=view.querySelector(".bkt-scroll");
  if(b&&pos.x)b.scrollLeft=pos.x;
}
function render(){
  var view=document.getElementById("view"),bar=document.getElementById("tabbar");
  var pos=readScroll(view),stessa=(lastScreen===S.screen);
  lastScreen=S.screen;
  /* se l'identità salvata non corrisponde più a nessuno nel roster (soprannome
     cambiato, giocatore eliminato) si tornerebbe "fantasmi": si vede tutto ma non
     si può cancellare né modificare niente. Meglio richiedere chi sei. */
  if(S.me&&S.roster.length&&!myPlayer()){S.me=null;save();}
  if(!S.me){
    bar.style.display="none";
    /* c'è un codice nell'indirizzo ma non si sa ancora se è valido: niente
       elenco né "iscriviti" finché non lo sappiamo, altrimenti chi apre il
       PROPRIO link rischia di iscriversi di nuovo per sbaglio prima che
       l'app faccia in tempo a riconoscerlo */
    var inAttesaDiCodice=codiceDaUrl()&&!codeCheckDone;
    view.innerHTML=header()+'<div class="scroll">'+
      (inAttesaDiCodice?attesaCodice():(S.screen==="add"?addScreen():mePicker()))+'</div>';
    writeScroll(view,pos,stessa);
    return;
  }
  bar.style.display="block";
  var body={home:home,book:book,pairs:pairs,rank:rank,add:addScreen,me:me,editme:editProfileScreen,result:resultScreen,tour:tour,stats:statsScreen,admedit:adminEditScreen}[S.screen]||home;
  try{
    view.innerHTML=header()+'<div class="scroll">'+body()+'</div>';
  }catch(e){
    /* uno stato salvato in precedenza (es. un vecchio torneo con una struttura che
       una funzione più recente non si aspetta) può far fallire il disegno della
       schermata corrente. Senza questa rete, view.innerHTML non veniva mai scritto:
       schermo vuoto, senza errori visibili, senza modo di uscirne da soli. Si torna
       alla Home, che non dipende da nulla di così fragile; se fallisse pure quella,
       almeno un messaggio invece del nulla. */
    S.screen="home";save();
    try{view.innerHTML=header()+'<div class="scroll">'+home()+'</div>';}
    catch(e2){view.innerHTML='<div class="pad"><div style="background:#141E2A;'+
      'border:1px solid rgba(255,106,53,.3);border-radius:16px;padding:20px;'+
      'text-align:center;line-height:1.6">'+
      '<div style="font-size:15px;font-weight:700;color:#FF6A35;margin-bottom:8px">'+
      'Qualcosa si è inceppato</div>'+
      '<div style="font-size:13px;color:#8C99A8">Chiudi e riapri l\'app. Se continua, scrivi a MASSICCIO.</div></div></div>';}
  }
  writeScroll(view,pos,stessa);
  if(!tabsReady){TB.init();tabsReady=true;TB.select(tabIndex(),true);}
  else TB.select(tabIndex());
  if(S.screen==="tour"&&S.tournament&&S.tournament.type==="elim")requestAnimationFrame(drawBracketLines);
  /* le schermate appena disegnate hanno segnato di quali foto hanno bisogno:
     si chiedono adesso, tutte insieme, e solo quelle mancanti */
  chiediFotoMancanti();
}
/* se il link viene aperto quando l'app è già in esecuzione cambia solo la parte dopo
   il #, e lo script non riparte: senza questo, toccare il proprio link non farebbe nulla */
window.addEventListener("hashchange",function(){
  if(CODICI_ATTIVI&&codiceDaUrl())entraConCodice().then(function(ok){if(ok)render()});
});
render();
initSync();
</script>
